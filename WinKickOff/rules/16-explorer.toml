# Проводник: папки в «Этот компьютер» и область навигации. 28.09.2026, файл заказчика
# enable_namespaces_in_mypc.reg; значения проверены на Windows 11 25H2 (26200), справочник, карточка 19.

[[rule]]
id = "thispc.desktop"
group = "system.explorer"
phase = "specialize"
title = "Показывать «Рабочий стол» в «Этот компьютер»"
level = "optional"
default = false
tags = ["этот компьютер", "проводник", "namespace", "рабочий стол"]
doc = "docs/technical/reference/19-more-privacy.md#this-pc-folders"
summary = "Папка «Рабочий стол» видна в «Этот компьютер» над дисками, как в Windows 10."
effect = "Windows 11 с версии 22H2 скрывает папки пользователя в «Этот компьютер»; правило возвращает эту запись. Выключено по умолчанию: папка остаётся скрытой."
versions = "Windows 11 22H2 и новее; в 24H2 и 25H2 все записи есть и скрыты значением HiddenByDefault = 1. Пишется в 64-битную и 32-битную (WOW6432Node) ветви, чтобы диалоги 32-битных программ совпадали с проводником."
verify = 'reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\MyComputer\NameSpace\{B4BFCC3A-DB2C-424C-B029-7FE99A87C641}" /v HiddenByDefault'
rollback = "Значение 1 в обеих ветвях (умолчание Windows 11 24H2 и 25H2)."

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\MyComputer\NameSpace\{B4BFCC3A-DB2C-424C-B029-7FE99A87C641}'
name = "HiddenByDefault"
kind = "DWord"
value = 0
default = 1

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Explorer\MyComputer\NameSpace\{B4BFCC3A-DB2C-424C-B029-7FE99A87C641}'
name = "HiddenByDefault"
kind = "DWord"
value = 0
default = 1

