title = "Скрыть «Галерею» в области навигации проводника"
level = "optional"
default = true
tags = ["галерея", "gallery", "проводник", "область навигации", "namespace"]
doc = "docs/technical/reference/19-more-privacy.md#this-pc-folders"
summary = "Пункт «Галерея» (просмотр всех фотографий) не показывается в левой панели проводника у всех пользователей."
effect = "Меньше лишних пунктов в проводнике; сами фотографии и папка «Изображения» остаются доступны."
versions = "Windows 11 22H2 (22621.2361) и новее."
verify = 'reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Desktop\NameSpace\{e88865ea-0e1c-4e20-9aa6-edcd0212c87c}" /v HiddenByDefault'
rollback = "Удалить значение HiddenByDefault в обеих ветвях."

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Desktop\NameSpace\{e88865ea-0e1c-4e20-9aa6-edcd0212c87c}'
name = "HiddenByDefault"
kind = "DWord"
value = 1
default = "absent"

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Explorer\Desktop\NameSpace\{e88865ea-0e1c-4e20-9aa6-edcd0212c87c}'
name = "HiddenByDefault"
kind = "DWord"
value = 1
default = "absent"

[[rule]]
id = "nav.home-hidden"
group = "system.explorer"
phase = "specialize"
title = "Скрыть «Главную» в области навигации проводника"
level = "optional"
default = false
requires = ["nav.launch-to-this-pc"]
tags = ["главная", "home", "быстрый доступ", "проводник", "область навигации", "namespace"]
doc = "docs/technical/reference/19-more-privacy.md#this-pc-folders"
summary = "Пункт «Главная» (недавние файлы и закреплённые папки) не показывается в левой панели проводника; проводник открывается на «Этот компьютер»."
effect = "Недавние файлы не видны при открытии проводника. Выключено по умолчанию: вместе со скрытыми папками в «Этот компьютер» пользователи теряют быстрый путь к «Документам» и «Рабочему столу»; включать вместе с правилами «Показывать ... в «Этот компьютер»»."
risk = "По сообщениям пользователей вместе с «Главной» пропадают закреплённые папки быстрого доступа."
versions = "Windows 11 22H2 и новее."
verify = 'reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Desktop\NameSpace\{f874310e-b6b7-47dc-bc84-b9e6b38f5903}" /v HiddenByDefault'
rollback = "Удалить значение HiddenByDefault в обеих ветвях."

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Desktop\NameSpace\{f874310e-b6b7-47dc-bc84-b9e6b38f5903}'
name = "HiddenByDefault"
kind = "DWord"
value = 1
default = "absent"

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Explorer\Desktop\NameSpace\{f874310e-b6b7-47dc-bc84-b9e6b38f5903}'
name = "HiddenByDefault"
kind = "DWord"
value = 1
default = "absent"

[[rule]]
id = "nav.launch-to-this-pc"
group = "system.explorer"
phase = "default-user"
title = "Открывать проводник на «Этот компьютер»"
level = "optional"
default = false
tags = ["проводник", "launchto", "этот компьютер", "главная"]
doc = "docs/technical/reference/19-more-privacy.md#this-pc-folders"
summary = "Проводник (Win+E) открывается на «Этот компьютер», а не на «Главной»."
effect = "Сразу видны диски и папки «Этот компьютер». Нужно правилу «Скрыть «Главную»», иначе проводнику некуда открываться."
versions = "Windows 10 и 11."
verify = 'reg query "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" /v LaunchTo'
rollback = "Параметры папок, Открыть проводник для: «Главная»."

[[rule.actions]]
type = "reg"
path = 'DU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
name = "LaunchTo"
kind = "DWord"
value = 1
default = "absent"
