effect = "Нет кнопки виджетов и постоянно открытой веб-страницы MSN с рекламой; процесс Widgets.exe не запускается."
versions = "Политика Dsh с Windows 11 21H2; Windows Feeds для Windows 10 20H1+."
verify = "Параметры -> Персонализация -> Панель задач -> Виджеты"
rollback = "Удалить значения."

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Dsh'
name = "AllowNewsAndInterests"
kind = "DWord"
value = 0

[[rule.actions]]
