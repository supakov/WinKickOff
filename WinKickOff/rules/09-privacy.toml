group = "privacy.speech"
phase = "default-user"
title = "Экранный диктор без расширений"
level = "optional"
default = true
tags = ["диктор", "narrator", "расширения"]
doc = "docs/technical/reference/19-more-privacy.md#speech-and-input"
summary = "Выключены расширения экранного диктора (сценарии для Excel, Outlook и других программ)."
effect = "Значение из списка заказчика. Это не телеметрия: расширения улучшают работу диктора в программах."
risk = "Диктор хуже работает в Excel и Outlook: важно для незрячих сотрудников."
versions = "Windows 11 последних сборок."
verify = 'reg query "HKCU\Software\Microsoft\Narrator\NoRoam" /v ScriptingEnabled'
rollback = "Удалить значения."
[[rule.actions]]
type = "reg"
path = 'DU:\Software\Microsoft\Narrator\NoRoam'
name = "ScriptingEnabled"
kind = "DWord"
value = 0
default = "absent"

# --- 28.09.2026, customer list MoreOptions: drivers and devices (card 19)
[[rule]]
id = "drivers.coinstallers-off"
group = "system.drivers"
phase = "specialize"
title = "Не запускать сопутствующие программы установщиков драйверов (co-installers)"
level = "optional"
default = true
tags = ["драйверы", "co-installer", "устройства", "razer"]
doc = "docs/technical/reference/19-more-privacy.md#drivers-and-devices"
summary = "При подключении устройства Windows устанавливает драйвер, но не запускает сопутствующие программы производителя из пакета драйвера."
effect = "Закрывает класс атак, когда программа производителя (случай Razer Synapse, 2021) запускается с правами SYSTEM при подключении устройства. Драйверы из Центра обновления Windows продолжают приходить."
risk = "Фирменные утилиты старых принтеров, сканеров и игровых устройств придётся устанавливать вручную; проверить на тестовом ПК с устройствами организации."
versions = "Все выпуски Windows 10 и 11; значение широко используется, но не описано на Microsoft Learn. С 2023 года Microsoft не подписывает пакеты с co-installers."
verify = 'reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Device Installer" /v DisableCoInstallers'
rollback = "Удалить значения."
[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Device Installer'
name = "DisableCoInstallers"
kind = "DWord"
value = 1
default = "absent"

[[rule]]
id = "drivers.metadata-off"
group = "system.drivers"
phase = "specialize"
title = "Не загружать приложения и значки устройств из интернета"
level = "optional"
default = true
tags = ["драйверы", "метаданные", "устройства"]
doc = "docs/technical/reference/19-more-privacy.md#drivers-and-devices"
summary = "Windows не скачивает по метаданным устройства связанные приложения производителей и их значки."
effect = "Никаких программ производителя без ведома пользователя. Служба метаданных устройств выведена из эксплуатации Microsoft в 2025 году, политика страхует от остатков."
versions = "Windows 10 1809 и новее, Pro."
verify = 'reg query "HKLM\SOFTWARE\Policies\Microsoft\Windows\Device Metadata" /v PreventDeviceMetadataFromNetwork'
rollback = "Удалить значения."
[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Device Metadata'
name = "PreventDeviceMetadataFromNetwork"
kind = "DWord"
value = 1
