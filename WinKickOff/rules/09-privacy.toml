path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
name = "DisableWebSearch"
kind = "DWord"
value = 1

[[rule]]
id = "system.long-paths"
group = "system"
phase = "specialize"
title = "Поддержка длинных путей (более 260 символов)"
level = "optional"
default = true
tags = ["длинные пути", "longpathsenabled", "260"]
doc = "docs/technical/reference/12-telemetry-consumer-ai.md#longpathsenabled-unconditional"
summary = "Программы с манифестом longPathAware (PowerShell 7, Git, современные архиваторы) работают с путями длиннее 260 символов."
effect = "Проводник и старые программы ограничение сохраняют; безвредно."
versions = "Windows 10 1607+."
verify = "Get-ItemProperty HKLM:\\SYSTEM\\CurrentControlSet\\Control\\FileSystem -Name LongPathsEnabled"
rollback = "Значение 0."

[[rule.actions]]
type = "reg"
path = 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem'
name = "LongPathsEnabled"
kind = "DWord"
value = 1
default = 0

