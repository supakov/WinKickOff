["apps.remove.onedrive"]
title = "OneDrive"
summary = "OneDrive не устанавливается пользователям: из профиля по умолчанию удаляется автозапуск его установщика."
effect = "Учётные записи, созданные после установки (Admin, User и следующие), получают профиль без OneDrive: нет значка, папки OneDrive и синхронизации файлов с облаком. Пользователи, уже входившие в систему, свой OneDrive сохраняют."
risk = "Файлы пользователей не копируются в облако Microsoft; резервное копирование организации настраивается отдельно."
versions = "Windows 10 и 11. Установщик OneDriveSetup.exe (в Windows 11 24H2+ в System32) остаётся в системе и запускается только вручную."
verify = "После первого входа нового пользователя: нет папки %LOCALAPPDATA%\\Microsoft\\OneDrive и значения OneDrive в HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run."
rollback = "Для пользователя: запустить %SystemRoot%\\System32\\OneDriveSetup.exe или установить OneDrive с сайта Microsoft."
tags = ["облако", "синхронизация"]

["onedrive.kfm-block"]
title = "OneDrive: запретить перенос папок пользователя в облако"
summary = "Пользователи не могут перенести «Рабочий стол», «Документы» и «Изображения» в OneDrive (ни в рабочий, ни в личный), резервное копирование папок в параметрах OneDrive недоступно."
effect = "Рабочие файлы остаются на компьютере и не попадают в личное облако сотрудника. На ПК в домене Microsoft запрещает перенос в личный OneDrive сама, в рабочей группе нужна эта политика."
versions = "Клиент синхронизации OneDrive (все поддерживаемые версии). Значение в HKCU из списка заказчика не описано Microsoft и не пишется."
verify = "reg query \"HKLM\\SOFTWARE\\Policies\\Microsoft\\OneDrive\" /v KFMBlockOptIn"
rollback = "Удалить значение."
tags = ["известные папки", "облако"]

