["office.connected-ai-off"]
title = "Office: выключить подключённые возможности, анализирующие содержимое (в том числе Copilot)"
summary = "Политика «Разрешить подключённые возможности Office, которые анализируют содержимое» выключена: Copilot в Word, Excel, PowerPoint, Outlook и OneNote недоступен."
effect = "Содержимое документов не отправляется в облачные сервисы ИИ Microsoft. Единственный документированный способ убрать Copilot из приложений Office при любой учётной записи."
risk = "Недоступны также диктовка, переводчик, облачный редактор (простая проверка орфографии остаётся), конструктор слайдов, подсказки текста, расшифровка, типы данных, карты и Python в Excel."
versions = "Microsoft 365 Apps 1904 и новее, Office 2021 и 2024 (розница и LTSC)."
verify = "reg query \"HKCU\\Software\\Policies\\Microsoft\\office\\16.0\\common\\privacy\""
rollback = "Удалить значение в профиле пользователя."
tags = ["подключённые возможности", "ии"]

["office.optional-connected-off"]
title = "Office: выключить дополнительные необязательные подключённые возможности"
summary = "Выключены дополнительные функции Office на основе Bing: интеллектуальный поиск, исследователь, изображения и видео из интернета, 3D-карты, а также веб-поиск Copilot."
effect = "Выделенный текст и запросы из документов не отправляются в Bing."
risk = "Нет вставки изображений из интернета и поиска сведений прямо из документа."
versions = "Microsoft 365 Apps 1904 и новее, Office 2021 и 2024."
verify = "reg query \"HKCU\\Software\\Policies\\Microsoft\\office\\16.0\\common\\privacy\" /v controllerconnectedservicesenabled"
rollback = "Удалить значение в профиле пользователя."
tags = ["подключённые возможности"]

["office.download-content-off"]
title = "Office: не загружать содержимое из интернета"
summary = "Office не загружает из интернета шаблоны, значки, изображения, облачные шрифты и справку."
effect = "Меньше обращений Office к серверам Microsoft. Это не ИИ, поэтому правило выключено по умолчанию."
risk = "Нет онлайн-шаблонов, значков, стоковых изображений, облачных шрифтов и справки F1."
versions = "Microsoft 365 Apps 1904 и новее, Office 2021 и 2024."
verify = "reg query \"HKCU\\Software\\Policies\\Microsoft\\office\\16.0\\common\\privacy\" /v downloadcontentdisabled"
rollback = "Удалить значение в профиле пользователя."
tags = ["шаблоны"]

["office.telemetry-off"]
title = "Office: не отправлять диагностические данные"
summary = "Уровень диагностических данных Office «Не отправлять»: ни обязательные, ни необязательные данные не уходят в Microsoft."
effect = "Остаются только служебные данные, без которых Office не работает."
versions = "Microsoft 365 Apps 1904 и новее, Office 2021 и 2024. Путь без 16.0: Software\\Policies\\Microsoft\\office\\common\\clienttelemetry."
verify = "reg query \"HKCU\\Software\\Policies\\Microsoft\\office\\common\\clienttelemetry\" /v sendtelemetry"
rollback = "Удалить значение в профиле пользователя."
tags = ["телеметрия", "диагностика"]

["office.feedback-off"]
title = "Office: без отзывов и опросов"
summary = "Кнопка отправки отзыва и опросы в приложениях Office выключены."
effect = "Снимки экрана, журналы и фрагменты содержимого (в том числе запросы к Copilot) не уходят в Microsoft вместе с отзывами."
versions = "Microsoft 365 Apps, Office 2019 и новее."
verify = "reg query \"HKCU\\Software\\Policies\\Microsoft\\office\\16.0\\common\\feedback\""
rollback = "Удалить значения в профиле пользователя."
tags = ["отзывы", "опросы"]

["office.copilot-checkbox-off"]
title = "Office: флажок «Включить Copilot» снят в Word, Excel и OneNote"
summary = "Пользовательские настройки Copilot в Word, Excel и OneNote выключены заранее: значения EnableCopilot из списка заказчика."
effect = "Флажок «Включить Copilot» в параметрах приложений есть только при входе в Office с личной учётной записью Microsoft. Значения не описаны Microsoft и не заблокированы: пользователь может включить Copilot снова. Надёжно Copilot выключает правило «выключить подключённые возможности, анализирующие содержимое»."
versions = "Word 2412, Excel 2501, OneNote 2502 и новее."
verify = "reg query \"HKCU\\Software\\Microsoft\\Office\\16.0\\Word\\Options\" /v EnableCopilot"
rollback = "Файл, Параметры, Copilot, флажок «Включить Copilot»."

["thispc.desktop"]
title = "Показывать «Рабочий стол» в «Этот компьютер»"
summary = "Папка «Рабочий стол» видна в «Этот компьютер» над дисками, как в Windows 10."
effect = "Windows 11 с версии 22H2 скрывает папки пользователя в «Этот компьютер»; правило возвращает эту запись. Выключено по умолчанию: папка остаётся скрытой."
versions = "Windows 11 22H2 и новее; в 24H2 и 25H2 все записи есть и скрыты значением HiddenByDefault = 1. Пишется в 64-битную и 32-битную (WOW6432Node) ветви, чтобы диалоги 32-битных программ совпадали с проводником."
verify = "reg query \"HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Explorer\\MyComputer\\NameSpace\\{B4BFCC3A-DB2C-424C-B029-7FE99A87C641}\" /v HiddenByDefault"
rollback = "Значение 1 в обеих ветвях (умолчание Windows 11 24H2 и 25H2)."
tags = ["этот компьютер", "проводник", "рабочий стол"]

