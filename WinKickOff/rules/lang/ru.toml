# Russian texts of the rule catalog (rules/NN-*.toml). Table key: the rule id; _groups: group titles and summaries.
# Fields: title, summary, effect, risk, versions, verify, rollback, tags; params.<name>; values.<name>."<value>".
# A missing text falls back to the English source; tests/test_docs.py checks that these files are complete.
_language = "Русский"

["install.bypass-tpm"]
title = "Обход проверки TPM 2.0"
summary = "Установщик не требует TPM 2.0. На ПК с TPM модуль остаётся включённым и используется."
effect = "Установка проходит на ПК без TPM или с TPM 1.2 без сообщения о несовместимости."
risk = "Без TPM недоступны автоматическое шифрование устройства и BitLocker без пароля при загрузке. Microsoft не гарантирует обновления неподдерживаемым ПК."
versions = "Ключи LabConfig действуют только в установщике Windows 11 (21H2 и новее); Windows 10 их игнорирует."
rollback = "Удалить правило; на установленную систему не влияет."
tags = ["старое железо", "совместимость"]

["install.bypass-secureboot"]
title = "Обход проверки Secure Boot"
summary = "Установщик не требует включённой Secure Boot."
effect = "Установка проходит на ПК с BIOS/CSM или с выключенной Secure Boot."
risk = "Без Secure Boot не работают Credential Guard и часть защит ядра; защита LSA в этом файле выбрана без привязки к UEFI именно ради таких ПК."
versions = "Только установщик Windows 11."
tags = ["старое железо"]

["install.bypass-cpu"]
title = "Обход проверки процессора"
summary = "Установщик не сверяет процессор со списком поддерживаемых."
effect = "Установка проходит на процессорах старше 8-го поколения Intel и Ryzen 2000."
risk = "В 24H2 требование инструкций POPCNT и SSE4.2 не обходится: на очень старых процессорах установка невозможна."
versions = "Только установщик Windows 11."
tags = ["процессор", "старое железо"]

["install.bypass-ram"]
title = "Обход проверки объёма памяти"
summary = "Установщик не требует 4 ГБ памяти."
effect = "Установка проходит на ПК с меньшим объёмом памяти; работа будет медленной."
versions = "Только установщик Windows 11."
tags = ["память"]

["install.bypass-storage"]
title = "Обход проверки размера диска"
summary = "Установщик не требует 64 ГБ на диске."
effect = "Установка проходит на маленькие диски; место под обновления нужно контролировать."
versions = "Только установщик Windows 11."
tags = ["диск"]

["install.bypass-nro"]
title = "Разрешить завершение OOBE без интернета и учётной записи Microsoft"
summary = "Ключ BypassNRO: первичная настройка не требует подключения к сети и аккаунта Microsoft."
effect = "Страховка: учётные записи создаются из файла, но при изменении поведения OOBE ключ не даст установке застрять на экране сети."
versions = "Windows 11 21H2 и новее. Microsoft объявила об удалении обходов в сборках Insider 2025 года; на выпущенных 24H2 и 25H2 ключ действует."
verify = "reg query HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\OOBE /v BypassNRO"
rollback = "Удалить значение; на установленную систему не влияет."
tags = ["локальная учётная запись", "сеть"]

["install.netfx3"]
title = ".NET Framework 3.5 с установочного носителя"
summary = "Ищет папку sources\\sxs на подключённых дисках и включает .NET Framework 3.5 (включая 2.0 и 3.0) без интернета."
effect = "Старые программы учёта, клиент-банки и драйверы ключей ЭЦП работают сразу после установки."
risk = "Носитель должен оставаться подключённым во время первой перезагрузки; иначе компонент не установится и в лог попадёт WARN. Позже его можно добавить через Параметры при наличии интернета."
versions = "Папка sources\\sxs есть во всех официальных ISO Windows 10 и 11; в урезанных образах может отсутствовать."
verify = "Get-WindowsOptionalFeature -Online -FeatureName NetFx3"
rollback = "Disable-WindowsOptionalFeature -Online -FeatureName NetFx3"
tags = ["старые программы", "1с"]

["oobe.hide-eula"]
title = "Скрыть экран лицензионного соглашения"
summary = "Лицензия принята в установщике (AcceptEula), экран в OOBE не показывается."
effect = "Одним экраном меньше; ответственность за принятие условий несёт организация."
tags = ["лицензия"]

["oobe.hide-oem-registration"]
title = "Скрыть экран регистрации у производителя"
summary = "Экран регистрации OEM не показывается (появляется только на образах производителей)."
effect = "Безвредно на образах Microsoft; экономит экран на OEM-образах."

["oobe.hide-online-account"]
title = "Скрыть экраны учётной записи Microsoft"
summary = "Экраны входа в аккаунт Microsoft и создания локальной учётной записи не показываются: учётные записи заданы в файле."
effect = "После подготовки система сразу показывает экран входа со стартовыми учётными записями."
risk = "Работает только вместе с учётными записями в разделе «Учётные записи»; без них OOBE потребует создать учётную запись."
tags = ["учётная запись microsoft", "локальная учётная запись"]

["oobe.hide-wireless"]
title = "Скрыть экран подключения к сети"
summary = "Экран «Подключитесь к сети» скрыт всегда, а не только при проводном подключении."
effect = "Установка не останавливается на ноутбуках без кабеля; Wi-Fi настраивается после входа."
tags = ["сеть"]

["oobe.protect-your-pc"]
title = "Экран параметров конфиденциальности: отключить экспресс-параметры"
summary = "Экран конфиденциальности не показывается; отправка данных, реклама и определение местоположения по умолчанию выключены."
effect = "SmartScreen и Defender не затрагиваются: они включаются отдельными правилами."
versions = "Значение 3 работает на Windows 10 и 11, включая 24H2."
tags = ["конфиденциальность", "телеметрия"]
params.mode = "Режим"
values.mode."3" = "Отключить все экспресс-параметры"
values.mode."1" = "Включить экспресс-параметры (отправка данных)"

["printing.spooler-automatic"]
title = "Диспетчер печати запускается автоматически"
summary = "Служба Spooler переводится в автоматический запуск (реестр и Set-Service), PrintNotify остаётся ручной."
effect = "Печать работает сразу после установки: принтеры USB и сетевые, «Печать в PDF». Оригинальный файл UnattendedWinstall переводил службу в ручной режим, и печать не работала."
risk = "Диспетчер печати исторически источник уязвимостей (PrintNightmare); компенсируется правилом установки драйверов только администраторами и брандмауэром."
versions = "Без изменений на всех версиях. В 24H2 есть режим защищённой печати (WPP), он не включается: старые принтеры требуют свои драйверы."
verify = "Get-Service Spooler | Select-Object Status, StartType"
rollback = "Set-Service Spooler -StartupType Manual"
tags = ["печать", "принтер", "служба"]

["printing.point-and-print-admins"]
title = "Драйверы принтеров устанавливают только администраторы"
summary = "Политика Point and Print: установка и обновление драйверов принтеров требуют прав администратора и показывают предупреждение."
effect = "Стандартный пользователь не установит драйвер принтера; уже установленные драйверы и класс-драйверы доступны всем."
risk = "Подключение сетевого принтера с новым драйвером выполняет администратор. Пока у Admin пустой пароль, запрос учётных данных у пользователя не пройдёт."
versions = "Значение Windows по умолчанию с августа 2021 (KB5005652); правило закрепляет его политикой."
verify = "Get-ItemProperty 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Printers\\PointAndPrint'"
rollback = "RestrictDriverInstallationToAdministrators = 0 (возвращает вектор PrintNightmare)."
tags = ["печать", "драйвер"]

["update.unblock"]
title = "Снять любые блокировки Центра обновления"
summary = "Удаляет политики, которые отключают обновления, драйверы или автообновление Store, и возвращает отключённые службы обновления в ручной режим."
effect = "На чистом образе ничего не меняет; защищает от следов сторонних «оптимизаторов» и делает повторный запуск скрипта безопасным."
versions = "Без изменений."
verify = "Get-ItemProperty HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate\\AU"
tags = ["обновления"]

["update.automatic"]
title = "Автоматическая установка обновлений и период активности"
summary = "Обновления скачиваются и ставятся сами; автоматическая перезагрузка запрещена в период активности."
effect = "Перезагрузка ночью или до начала рабочего дня; пользователь видит уведомление и может отложить в пределах политики."
risk = "Период активности не длиннее 18 часов. ПК, работающие круглосуточно, перезагрузятся вне периода."
versions = "Работает на Windows 10 и 11; в 24H2 фиксированные часы заменяют автоопределение периода."
verify = "Get-ItemProperty HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate"
rollback = "Удалить SetActiveHours, ActiveHoursStart, ActiveHoursEnd."
tags = ["период активности", "перезагрузка"]
params.start = "Начало периода активности (час)"
params.end = "Конец периода активности (час)"

["update.other-microsoft-products"]
title = "Обновления других продуктов Microsoft (Office, .NET)"
summary = "Подключение к Microsoft Update: исправления Office (MSI), .NET и других продуктов приходят вместе с Windows."
effect = "Переключатель в Параметрах включён и заблокирован. Office 365 (Click-to-Run) обновляется своим механизмом независимо."
versions = "Без изменений."
verify = "(New-Object -ComObject Microsoft.Update.ServiceManager).Services | Where-Object IsDefaultAUService"

["update.defer-feature"]
title = "Отсрочка обновлений функций"
summary = "Ежегодные обновления версии приходят с задержкой; ежемесячные обновления безопасности не откладываются."
effect = "За время отсрочки Microsoft исправляет ошибки первых недель, а программы учёта выпускают совместимые версии."
risk = "Требует работающей оценки совместимости: правило минимальной телеметрии намеренно оставляет DiagTrack в ручном режиме, а не отключает."
versions = "Windows 10 1703+ и Windows 11 Pro/Enterprise; на Home отсрочки нет. Диапазон 0-365 дней."
verify = "Get-ItemProperty HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate | Select-Object DeferFeatureUpdatesPeriodInDays"
rollback = "Удалить DeferFeatureUpdates и DeferFeatureUpdatesPeriodInDays."
tags = ["обновления функций", "отсрочка"]
params.days = "Дней отсрочки"

["update.delivery-optimization-lan"]
title = "Delivery Optimization: обмен обновлениями только в локальной сети"
summary = "ПК одной сети обмениваются скачанными фрагментами обновлений между собой; наружу ничего не отдаётся."
effect = "В офисе с десятком ПК обновление скачивается из интернета один раз. Нужен открытый порт 7680 между ПК (правило брандмауэра Windows создаёт сама)."
versions = "Режимы 0 (только HTTP), 1 (локальная сеть), 3 (интернет), 99 (простой режим) одинаковы с Windows 10 1607."
verify = "Get-DOConfig"
tags = ["трафик", "локальная сеть"]
