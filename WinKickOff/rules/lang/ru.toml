title = "Показывать «Объемные объекты» в «Этот компьютер»"
summary = "Папка «Объемные объекты» (3D Objects) снова видна в «Этот компьютер», как в Windows 10."
effect = "В Windows 11 запись удалена, известная папка осталась. Правило создаёт запись в обеих ветвях; при первом открытии папка появится в профиле пользователя. Выключено по умолчанию."
versions = "Windows 10 1709-20H2 показывали папку сами; с Windows 11 записи нет. Действие на 25H2 проверить на тестовом ПК."
verify = "reg query \"HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Explorer\\MyComputer\\NameSpace\\{0DB7E03F-FC29-4DC6-9020-FF41B59E513A}\""
rollback = "Удалить раздел {0DB7E03F-FC29-4DC6-9020-FF41B59E513A} в обеих ветвях NameSpace (автоматический возврат не удаляет разделы)."
tags = ["этот компьютер", "проводник", "объемные объекты"]

["nav.gallery-hidden"]
title = "Скрыть «Галерею» в области навигации проводника"
summary = "Пункт «Галерея» (просмотр всех фотографий) не показывается в левой панели проводника у всех пользователей."
effect = "Меньше лишних пунктов в проводнике; сами фотографии и папка «Изображения» остаются доступны."
versions = "Windows 11 22H2 (22621.2361) и новее."
verify = "reg query \"HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Desktop\\NameSpace\\{e88865ea-0e1c-4e20-9aa6-edcd0212c87c}\" /v HiddenByDefault"
rollback = "Удалить значение HiddenByDefault в обеих ветвях."
