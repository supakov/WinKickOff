["nav.home-hidden"]
title = "Скрыть «Главную» в области навигации проводника"
summary = "Пункт «Главная» (недавние файлы и закреплённые папки) не показывается в левой панели проводника; проводник открывается на «Этот компьютер»."
effect = "Недавние файлы не видны при открытии проводника. Выключено по умолчанию: вместе со скрытыми папками в «Этот компьютер» пользователи теряют быстрый путь к «Документам» и «Рабочему столу»; включать вместе с правилами «Показывать ... в «Этот компьютер»»."
risk = "По сообщениям пользователей вместе с «Главной» пропадают закреплённые папки быстрого доступа."
versions = "Windows 11 22H2 и новее."
verify = "reg query \"HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Desktop\\NameSpace\\{f874310e-b6b7-47dc-bc84-b9e6b38f5903}\" /v HiddenByDefault"
rollback = "Удалить значение HiddenByDefault в обеих ветвях."
tags = ["главная", "быстрый доступ", "проводник", "область навигации"]

["nav.launch-to-this-pc"]
title = "Открывать проводник на «Этот компьютер»"
summary = "Проводник (Win+E) открывается на «Этот компьютер», а не на «Главной»."
effect = "Сразу видны диски и папки «Этот компьютер». Нужно правилу «Скрыть «Главную»», иначе проводнику некуда открываться."
