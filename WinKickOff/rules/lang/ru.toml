["defender.realtime"]
title = "Защита в реальном времени включена и закреплена"
summary = "Удаляет значения, которыми сторонние скрипты отключают Defender, и закрепляет защиту в реальном времени, поведенческий анализ, проверку загрузок и скриптов."
effect = "Антивирус нельзя выключить через реестр; переключатели в Безопасности Windows управляются политикой."
versions = "Без изменений; защита от подделки (Tamper Protection) дополнительно не даёт ослабить защиту."
verify = "Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, BehaviorMonitorEnabled"
tags = ["антивирус", "реальное время", "поведенческий анализ"]

["defender.cloud"]
title = "Облачная защита: MAPS, отправка образцов, уровень блокировки"
summary = "Участие в MAPS уровня «Расширенный», автоматическая отправка безопасных образцов, уровень облачной блокировки «Высокий», ожидание вердикта до 50 секунд."
effect = "Новые вредоносные файлы без сигнатур блокируются по облачной репутации за секунды; подозрительный файл задерживается до минуты перед первым запуском."
risk = "Уровень «Высокий» повышает долю ложных срабатываний на редких самописных программах; решение: исключение для файла или уровень 0. Требует интернета."
versions = "Windows 10 1607 (уровень блокировки) и 1703 (тайм-аут); 24H2 без изменений."
verify = "Get-MpPreference | Select-Object MAPSReporting, SubmitSamplesConsent, CloudBlockLevel, CloudExtendedTimeout"
rollback = "Удалить четыре значения; Defender вернётся к умолчаниям."
tags = ["облако", "образцы"]
params.block_level = "Уровень облачной блокировки"
values.block_level."2" = "Высокий"
values.block_level."0" = "По умолчанию"
values.block_level."4" = "Высокий плюс (больше ложных срабатываний)"
values.block_level."6" = "Нулевая терпимость (блокирует всё неизвестное)"
params.timeout = "Дополнительное ожидание вердикта облака, секунд"

["defender.pua"]
title = "Блокировать потенциально нежелательные программы (PUA)"
summary = "Defender блокирует adware, установщики-бандлы, майнеры и «оптимизаторы» при скачивании и запуске."
effect = "Закрывает самый частый канал заражения непрофессионалов: «бесплатная программа с сайта с кнопкой Скачать»."
risk = "Легитимные утилиты, помеченные как PUA (некоторые средства удалённого доступа), требуют исключения."
versions = "Политика с Windows 10 1607; переключатель в Параметрах с 2004."
verify = "Get-MpPreference | Select-Object PUAProtection"
rollback = "Удалить значение PUAProtection."
tags = ["бандлы", "майнеры"]

["defender.network-protection"]
title = "Сетевая защита: блокировать подключения к опасным адресам"
