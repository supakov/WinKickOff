["user-logon.input-languages"]
title = '''User input language list from the profile (including "Russian (Ukraine)")'''
summary = '''Replaces the user's input language list with the list from the "Languages and region" node (by default en-US, uk-UA, ru-UA). Languages without a numeric code, such as "Russian (Ukraine)", cannot be set in XML, so they are applied here; if Windows has not assigned them a keyboard layout, a fallback list is applied in which they are replaced with the base language.'''
effect = '''The user's language switcher shows the same order as the profile; the sign-in screen keeps the list from XML (with the base language instead of "Russian (Ukraine)").'''
versions = '''ru-UA as an input language is supported by Windows 10 1803+ and 11; on build 26200 it gets the temporary code 2000:00000419. Windows may shorten tags (uk-UA is displayed as uk).'''
verify = '''Get-WinUserLanguageList | Select-Object LanguageTag, InputMethodTips'''
rollback = '''Settings -> Language & region, or Set-WinUserLanguageList.'''

["post-oobe.password-never-expires"]
title = '''"Password never expires" flag on the initial accounts'''
summary = '''PasswordNeverExpires is set for every account in the profile. Duplicates the machine-wide net accounts setting in case it is changed.'''
effect = '''The initial accounts without a password will not be required to change the password.'''
versions = '''Set-LocalUser since Windows 10 1607.'''
verify = '''Get-LocalUser -Name Admin, User | Select-Object Name, PasswordExpires: the PasswordExpires field is empty.'''
rollback = '''Set-LocalUser -Name <name> -PasswordNeverExpires $false as administrator; do this together with assigning passwords.'''

["post-oobe.disable-builtin-accounts"]
title = '''Built-in Administrator and Guest stay disabled'''
summary = '''The accounts with RID 500 and 501 are found by SID (the names are localized on the Ukrainian image) and disabled if they are enabled.'''
effect = '''The well-known names cannot be used to sign in.'''
versions = '''Get-LocalUser since Windows 10 1607.'''
verify = '''Get-LocalUser | Where-Object { $_.SID.Value -match '-50[01]$' } | Select-Object Name, Enabled: both accounts have Enabled = False.'''
rollback = '''Enable-LocalUser -SID <SID> as administrator. Enabling the built-in Administrator is not recommended: its name is known to everyone.'''

["post-oobe.collect-specialize-errors"]
title = '''Move specialize pass errors to the log'''
summary = '''If the specialize command wrappers recorded an error (the script was not extracted or failed), its text goes to Post-OOBE.log marked SPECIALIZE ERROR.'''
effect = '''The only way to find out that the machine script did not run.'''
verify = '''C:\ProgramData\Unattend\Logs\Post-OOBE.log: no SPECIALIZE ERROR lines; no C:\Windows\Temp\ua.err file.'''
rollback = '''Not required: the rule only moves the error text to the log and deletes the temporary file.'''

["post-oobe.delete-answer-file-copies"]
title = '''Delete answer file copies from the system'''
summary = '''Windows 11 24H2 leaves copies of the answer file (with account names and passwords, if there were any) in C:\Windows\Panther; they are deleted.'''
effect = '''No description of the accounts remains on the disk.'''
versions = '''Windows 10 kept one copy, 24H2 keeps two.'''
verify = '''Test-Path C:\Windows\Panther\unattend.xml and Test-Path C:\Windows\Panther\unattend-original.xml return False.'''
rollback = '''Cannot be rolled back and is not needed: the running system does not need the copies, and the original file remains on the installation media.'''

