title = '''Show "Videos" in "This PC" (second entry)'''
summary = '''The second entry of the "Videos" folder (the redirectable known folder) is visible in "This PC".'''
effect = '''Both entries lead to the same profile folder; Windows 10 showed only the first one. Do not turn it on together with the rule Show "Videos" in "This PC": the folder may appear twice.'''
versions = '''Windows 11 22H2 and later; in 24H2 and 25H2 all entries exist and are hidden by the value HiddenByDefault = 1. Written to both the 64-bit and the 32-bit (WOW6432Node) branches so that dialogs of 32-bit programs match File Explorer.'''
verify = '''reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\MyComputer\NameSpace\{A0953C92-50DC-43bf-BE83-3742FED03C9C}" /v HiddenByDefault'''
rollback = '''Value 1 in both branches (the Windows 11 24H2 and 25H2 default).'''

["thispc.3d-objects"]
title = '''Show "3D Objects" in "This PC"'''
summary = '''The "3D Objects" folder is visible in "This PC" again, as in Windows 10.'''
effect = '''Windows 11 removed the entry, but the known folder remains. The rule creates the entry in both branches; the folder appears in the user profile when it is first opened. Off by default.'''
versions = '''Windows 10 1709-20H2 showed the folder on their own; Windows 11 has no entry. Check the effect on 25H2 on a test PC.'''
verify = '''reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\MyComputer\NameSpace\{0DB7E03F-FC29-4DC6-9020-FF41B59E513A}"'''
rollback = '''Delete the {0DB7E03F-FC29-4DC6-9020-FF41B59E513A} key in both NameSpace branches (the automatic return to defaults does not delete keys).'''

["nav.gallery-hidden"]
title = '''Hide "Gallery" in the File Explorer navigation pane'''
summary = '''The "Gallery" item (a view of all photos) is not shown in the left pane of File Explorer for any user.'''
effect = '''Fewer unnecessary items in File Explorer; the photos themselves and the "Pictures" folder remain available.'''
versions = '''Windows 11 22H2 (22621.2361) and later.'''
verify = '''reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Desktop\NameSpace\{e88865ea-0e1c-4e20-9aa6-edcd0212c87c}" /v HiddenByDefault'''
rollback = '''Delete the HiddenByDefault value in both branches.'''

["nav.home-hidden"]
title = '''Hide "Home" in the File Explorer navigation pane'''
summary = '''The "Home" item (recent files and pinned folders) is not shown in the left pane of File Explorer; File Explorer opens to "This PC".'''
effect = '''Recent files are not visible when File Explorer opens. Off by default: combined with the folders hidden in "This PC", users lose a quick way to "Documents" and "Desktop"; turn it on together with the rules Show ... in "This PC".'''
risk = '''According to user reports, the pinned Quick access folders disappear together with "Home".'''
versions = '''Windows 11 22H2 and later.'''
verify = '''reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Desktop\NameSpace\{f874310e-b6b7-47dc-bc84-b9e6b38f5903}" /v HiddenByDefault'''
rollback = '''Delete the HiddenByDefault value in both branches.'''

["nav.launch-to-this-pc"]
title = '''Open File Explorer to "This PC"'''
summary = '''File Explorer (Win+E) opens to "This PC", not to "Home".'''
effect = '''Drives and folders of "This PC" are visible right away. Needed by the rule Hide "Home", otherwise File Explorer has nowhere to open.'''
versions = '''Windows 10 and 11.'''
verify = '''reg query "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" /v LaunchTo'''
rollback = '''File Explorer Options -> Open File Explorer to: "Home".'''

