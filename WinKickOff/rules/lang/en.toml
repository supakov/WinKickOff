title = '''User input language list from the profile (including "Russian (Ukraine)")'''
summary = '''Replaces the user's input language list with the list from the "Languages and region" node (by default en-US, uk-UA, ru-UA). Languages without a numeric code, such as "Russian (Ukraine)", cannot be set in XML, so they are applied here; if Windows has not assigned them a keyboard layout, a fallback list is applied in which they are replaced with the base language.'''
effect = '''The user's language switcher shows the same order as the profile; the sign-in screen keeps the list from XML (with the base language instead of "Russian (Ukraine)").'''
versions = '''ru-UA as an input language is supported by Windows 10 1803+ and 11; on build 26200 it gets the temporary code 2000:00000419. Windows may shorten tags (uk-UA is displayed as uk).'''
verify = '''Get-WinUserLanguageList | Select-Object LanguageTag, InputMethodTips'''
rollback = '''Settings -> Language & region, or Set-WinUserLanguageList.'''

["post-oobe.password-never-expires"]
title = '''"Password never expires" flag on the initial accounts'''
summary = '''PasswordNeverExpires is set for every account in the profile. Duplicates the machine-wide net accounts setting in case it is changed.'''
effect = '''The initial accounts without a password will not be required to change the password.'''
versions = '''Set-LocalUser since Windows 10 1607.'''
verify = '''Get-LocalUser -Name Admin, User | Select-Object Name, PasswordExpires: the PasswordExpires field is empty.'''
rollback = '''Set-LocalUser -Name <name> -PasswordNeverExpires $false as administrator; do this together with assigning passwords.'''

["post-oobe.disable-builtin-accounts"]
title = '''Built-in Administrator and Guest stay disabled'''
summary = '''The accounts with RID 500 and 501 are found by SID (the names are localized on the Ukrainian image) and disabled if they are enabled.'''
effect = '''The well-known names cannot be used to sign in.'''
versions = '''Get-LocalUser since Windows 10 1607.'''
verify = '''Get-LocalUser | Where-Object { $_.SID.Value -match '-50[01]$' } | Select-Object Name, Enabled: both accounts have Enabled = False.'''
rollback = '''Enable-LocalUser -SID <SID> as administrator. Enabling the built-in Administrator is not recommended: its name is known to everyone.'''

["post-oobe.collect-specialize-errors"]
title = '''Move specialize pass errors to the log'''
summary = '''If the specialize command wrappers recorded an error (the script was not extracted or failed), its text goes to Post-OOBE.log marked SPECIALIZE ERROR.'''
effect = '''The only way to find out that the machine script did not run.'''
verify = '''C:\ProgramData\Unattend\Logs\Post-OOBE.log: no SPECIALIZE ERROR lines; no C:\Windows\Temp\ua.err file.'''
rollback = '''Not required: the rule only moves the error text to the log and deletes the temporary file.'''

["post-oobe.delete-answer-file-copies"]
title = '''Delete answer file copies from the system'''
summary = '''Windows 11 24H2 leaves copies of the answer file (with account names and passwords, if there were any) in C:\Windows\Panther; they are deleted.'''
effect = '''No description of the accounts remains on the disk.'''
versions = '''Windows 10 kept one copy, 24H2 keeps two.'''
verify = '''Test-Path C:\Windows\Panther\unattend.xml and Test-Path C:\Windows\Panther\unattend-original.xml return False.'''
rollback = '''Cannot be rolled back and is not needed: the running system does not need the copies, and the original file remains on the installation media.'''

["edge.diagnostic-data-off"]
title = '''Edge: do not send diagnostic data'''
summary = '''Edge does not send required or optional diagnostic data about the browser to Microsoft.'''
effect = '''Information about browser usage and visited sites is not sent to Microsoft. Replaces the deprecated MetricsReportingEnabled and SendSiteInfoToImproveServices policies from the issue #1 script.'''
versions = '''Edge 122 and later on Windows 10 and 11; older versions of Edge follow the general Windows telemetry setting.'''

["edge.search-telemetry-off"]
title = '''Edge: do not collect queries to third-party search engines'''
summary = '''Edge does not collect information about searches on third-party search engines (3P SERP telemetry).'''
effect = '''Queries to Google and other search engines are not included in Edge telemetry.'''
versions = '''Edge 120 and later.'''

["edge.sidebar-off"]
title = '''Edge: hide the sidebar'''
summary = '''The Edge sidebar with apps and shortcuts is not shown.'''
effect = '''Fewer distracting elements. Before Edge 141, hiding the sidebar also hides the Copilot button; starting with version 141, the Copilot icon is controlled by a policy that applies only to Entra ID profiles.'''
versions = '''Edge 99 and later.'''

["edge.shopping-off"]
title = '''Edge: turn off the shopping assistant'''
summary = '''Edge does not show price comparisons, coupons or cashback on store websites.'''
effect = '''No pop-up offers on store pages, and the addresses of those pages are not sent to the shopping service.'''
versions = '''Edge 87 and later.'''

["edge.rewards-off"]
title = '''Edge: hide Microsoft Rewards'''
summary = '''The Microsoft Rewards bonus program is not shown in Edge, and its switch in settings is turned off.'''
effect = '''No offers to earn points for searches and purchases.'''
versions = '''Edge 88 and later.'''

["edge.insider-promo-off"]
title = '''Edge: no Edge Insider program promotion'''
summary = '''Edge does not offer to install preview builds of the browser.'''
effect = '''Users do not install unstable versions of Edge in response to a promotional offer.'''
versions = '''Edge 98 and later.'''

["edge.sync-off"]
title = '''Edge: block sync'''
summary = '''Sync of Edge favorites, passwords, history and settings with a cloud account is turned off.'''
effect = '''Browser data does not go to the cloud and does not end up on employees' personal devices.'''
risk = '''Favorites and settings are not carried over between the user's computers.'''
versions = '''Edge 77 and later.'''

["edge.translate-off"]
title = '''Edge: do not offer page translation'''
summary = '''Edge does not offer to translate a page written in another language.'''
effect = '''Page text is not sent to a cloud translation service.'''
risk = '''Employees who read foreign-language websites lose built-in translation.'''
versions = '''Edge 77 and later.'''

["edge.web-capture-off"]
title = '''Edge: turn off Web Capture'''
summary = '''The feature for capturing a page or parts of it (Web Capture) is unavailable.'''
effect = '''Fewer built-in features that send page content to Microsoft services.'''
risk = '''Page screenshots have to be taken with Windows tools.'''
versions = '''Edge 87 and later.'''

["edge.autofill-address-off"]
title = '''Edge: do not save addresses for autofill'''
summary = '''Edge does not save addresses or fill them into forms.'''
effect = '''Employees' personal data is not stored in the browser profile.'''
versions = '''Edge 77 and later.'''

["edge.search-suggest-off"]
title = '''Edge: no search suggestions'''
summary = '''The Edge address bar does not show search engine suggestions.'''
effect = '''Typed text is not sent to the search engine until Enter is pressed.'''
versions = '''Edge 77 and later.'''

["edge.feedback-off"]
title = '''Edge: no feedback submission'''
summary = '''The feedback button and sending feedback to Microsoft are disabled.'''
effect = '''Screenshots and problem descriptions are not sent from the browser to Microsoft.'''
versions = '''Edge 77 and later.'''

["edge.signin-off"]
title = '''Edge: block browser sign-in'''
summary = '''Signing in to Edge with a Microsoft account or a work account is blocked.'''
effect = '''The browser profile stays local and is not linked to a cloud account.'''
risk = '''Sync and features that require sign-in are unavailable. In the issue #1 script this line is commented out: enable it deliberately.'''
versions = '''Edge 77 and later.'''

["edge.password-manager-off"]
title = '''Edge: block password saving'''
summary = '''The built-in Edge password manager does not offer to save passwords.'''
effect = '''Passwords are not stored in the browser profile.'''
risk = '''Without a password manager, users reuse passwords or write them down more often. Enable only if the organization has a separate password manager. In the issue #1 script this line is commented out: enable it deliberately.'''
versions = '''Edge 77 and later.'''

["edge.autofill-cards-off"]
title = '''Edge: do not save payment cards'''
summary = '''Edge does not save payment card details or fill them into forms.'''
effect = '''Card details are not stored in the browser profile.'''
risk = '''In the issue #1 script this line is commented out: enable it deliberately.'''
versions = '''Edge 77 and later.'''

["chrome.metrics-off"]
title = '''Chrome: do not send usage statistics and crash reports'''
summary = '''Chrome does not send usage statistics and crash reports to Google.'''
effect = '''Information about browser operation is not sent to Google.'''
versions = '''Chrome 8 and later.'''

["chrome.variations"]
title = '''Chrome: limit field trials (variations)'''
summary = '''Chrome does not enable experimental features for the user that Google rolls out without a browser update.'''
effect = '''Browser behavior changes only with updates. Value 1 keeps urgent security fixes.'''
risk = '''Value 2 may delay critical security fixes: Google does not recommend it. The issue #1 script used the nonexistent name ChromeVariationsEnabled.'''
versions = '''Chrome 83 and later.'''
params.mode = '''Field trials mode'''
values.mode."1" = '''Critical security and stability fixes only'''
values.mode."2" = '''Disable all (not recommended by Google)'''

["chrome.sync"]
title = '''Chrome: sync with Google'''
summary = '''Sync of Chrome bookmarks, passwords, history and settings with a Google account is blocked (or left to the user's choice).'''
effect = '''Browser data does not go to the Google cloud and does not end up on employees' personal devices.'''
risk = '''The issue #1 script set 0, which leaves the choice to the user; here the default is to block it, as for Edge.'''
versions = '''Chrome 8 and later.'''
params.value = '''Sync'''
values.value."1" = '''Blocked'''
values.value."0" = '''User decides (as in the issue #1 script)'''

["chrome.background-off"]
title = '''Chrome: do not run in the background after closing'''
summary = '''Chrome and its apps do not keep running after the last window is closed.'''
effect = '''The browser does not use memory or network when it is not in use.'''
versions = '''Chrome 19 and later.'''

["chrome.genai-off"]
title = '''Chrome: turn off generative AI features'''
summary = '''Chrome generative AI features (writing help, tab organization, history search and others) are blocked by default.'''
effect = '''Page content and employees' texts are not sent to Google models.'''
versions = '''Chrome 130 and later.'''

["chrome.genai-local-model-off"]
title = '''Chrome: do not download the local AI model'''
summary = '''Chrome does not download a local generative AI model to the computer.'''
effect = '''A model several gigabytes in size does not appear on the disk, and no network traffic is spent.'''
versions = '''Chrome 124 and later.'''

["chrome.devtools-genai-off"]
title = '''Chrome: turn off AI in developer tools'''
summary = '''Generative AI features in Chrome developer tools are blocked.'''
effect = '''Page code and data are not sent to Google models from DevTools.'''
versions = '''Chrome 125 and later.'''

["chrome.lens-overlay-off"]
title = '''Chrome: turn off Google Lens over the page'''
summary = '''Google Lens search of screen content (Lens Overlay) is unavailable.'''
effect = '''Page screenshots are not sent to Google for visual search.'''
risk = '''The issue #1 script set 0, which allows the feature; here it is 1. Starting with Chrome 147, the policy is deprecated.'''
versions = '''Chrome 126 and later.'''

["chrome.translate-off"]
title = '''Chrome: do not offer page translation'''
summary = '''Chrome does not offer to translate a page written in another language.'''
effect = '''Page text is not sent to the Google cloud translation service.'''
risk = '''Employees who read foreign-language websites lose built-in translation.'''
versions = '''Chrome 12 and later.'''

["chrome.signin-off"]
title = '''Chrome: block browser sign-in'''
summary = '''Signing in to Chrome with a Google account is blocked.'''
effect = '''The browser profile stays local and is not linked to a Google account.'''
risk = '''Sync and features that require sign-in are unavailable.'''
versions = '''Chrome 70 and later.'''

["chrome.search-suggest-off"]
title = '''Chrome: no search suggestions'''
summary = '''The Chrome address bar does not show search engine suggestions.'''
effect = '''Typed text is not sent to the search engine until Enter is pressed.'''
versions = '''Chrome 8 and later.'''

["chrome.cast-private-only"]
title = '''Chrome: Cast only on the local network'''
summary = '''Google Cast connects only to devices with private local network addresses.'''
effect = '''The screen cannot be cast to devices with public addresses.'''
versions = '''Chrome 67 and later.'''

["chrome.promotions-off"]
title = '''Chrome: no promotional pages or campaigns'''
summary = '''Chrome does not show Google promotional tabs and campaigns.'''
effect = '''Less advertising when the browser starts and updates. Replaces the deprecated PromotionalTabsEnabled policy from the issue #1 script.'''
versions = '''Chrome 128 and later.'''

["chrome.password-manager-off"]
title = '''Chrome: block password saving'''
summary = '''The built-in Chrome password manager does not offer to save passwords.'''
effect = '''Passwords are not stored in the browser profile.'''
risk = '''Without a password manager, users reuse passwords or write them down more often. Enable only if the organization has a separate password manager. In the issue #1 script this line is commented out: enable it deliberately.'''
versions = '''Chrome 8 and later.'''

["chrome.autofill-address-off"]
title = '''Chrome: do not save addresses for autofill'''
summary = '''Chrome does not save addresses or fill them into forms.'''
effect = '''Employees' personal data is not stored in the browser profile.'''
risk = '''In the issue #1 script this line is commented out: enable it deliberately.'''
versions = '''Chrome 69 and later.'''

["chrome.autofill-cards-off"]
title = '''Chrome: do not save payment cards'''
summary = '''Chrome does not save payment card details or fill them into forms.'''
effect = '''Card details are not stored in the browser profile.'''
risk = '''In the issue #1 script this line is commented out: enable it deliberately.'''
versions = '''Chrome 63 and later.'''

["chrome.builtin-dns-off"]
title = '''Chrome: Windows DNS instead of the built-in client'''
summary = '''Chrome resolves names through the Windows DNS client rather than its own built-in one.'''
effect = '''The organization's DNS settings, the hosts file and filtering DNS, if any, take effect.'''
risk = '''In the issue #1 script this line is commented out: enable it deliberately.'''
versions = '''Chrome 25 and later.'''

["brave.rewards-off"]
title = '''Brave: turn off Brave Rewards'''
summary = '''The Brave Rewards program, which rewards users for viewing ads, is unavailable.'''
effect = '''The browser does not show its own ads and does not award tokens.'''
versions = '''Brave policies; they take effect if Brave is installed.'''

["brave.wallet-off"]
title = '''Brave: turn off the crypto wallet'''
summary = '''The built-in Brave Wallet cryptocurrency wallet is unavailable.'''
effect = '''Cryptocurrency wallets and extensions do not appear on work computers.'''
versions = '''Brave policies; they take effect if Brave is installed.'''

["brave.vpn-off"]
title = '''Brave: turn off Brave VPN'''
summary = '''The paid Brave VPN is unavailable.'''
effect = '''Browser traffic does not go through a VPN, bypassing the organization's network rules.'''
versions = '''Brave policies; they take effect if Brave is installed.'''

["brave.ai-chat-off"]
title = '''Brave: turn off the Leo AI assistant'''
summary = '''The Leo AI assistant (AI Chat) in Brave is unavailable.'''
effect = '''Page content and employees' texts are not sent to AI models. The issue #1 script also used the nonexistent name BraveLeoEnabled.'''
versions = '''Brave policies; they take effect if Brave is installed.'''

["brave.stats-ping-off"]
title = '''Brave: no daily usage report'''
summary = '''Brave does not send the daily anonymous usage signal (stats ping).'''
effect = '''Fewer browser connections to Brave servers. The issue #1 script also used the nonexistent name BraveStatsPingDisabled.'''
versions = '''Brave policies; they take effect if Brave is installed.'''

["brave.p3a-off"]
title = '''Brave: no product analytics (P3A)'''
summary = '''Brave does not send anonymized P3A product analytics.'''
effect = '''Information about the use of browser features is not sent to Brave. The issue #1 script used the nonexistent name BraveP3ADisabled.'''
versions = '''Brave policies; they take effect if Brave is installed.'''

["brave.news-off"]
title = '''Brave: turn off Brave News'''
summary = '''The Brave News feed on the new tab page is unavailable.'''
effect = '''The new tab page has no news or promotional content.'''
versions = '''Brave policies; they take effect if Brave is installed.'''

["brave.talk-off"]
title = '''Brave: turn off Brave Talk'''
summary = '''The Brave Talk video calling service is unavailable.'''
effect = '''Video calls go only through services approved by the organization.'''
versions = '''Brave policies; they take effect if Brave is installed.'''

["brave.playlist-off"]
title = '''Brave: turn off Playlist'''
summary = '''The feature for saving video and audio for offline viewing (Playlist) is unavailable.'''
effect = '''Media files do not accumulate in the browser profile.'''
versions = '''Brave policies; they take effect if Brave is installed.'''

["brave.speedreader-off"]
title = '''Brave: turn off Speedreader'''
summary = '''The Speedreader simplified reading mode is unavailable.'''
effect = '''Fewer built-in features that change how pages look.'''
versions = '''Brave policies; they take effect if Brave is installed.'''

["brave.wayback-off"]
title = '''Brave: no Wayback Machine prompts'''
summary = '''Brave does not offer to open an archived copy of an unavailable page in the Wayback Machine.'''
effect = '''Addresses of unavailable pages are not sent to the internet archive.'''
versions = '''Brave policies; they take effect if Brave is installed.'''

["brave.web-discovery-off"]
title = '''Brave: turn off Web Discovery'''
summary = '''Brave does not share information about visited pages to populate its search index.'''
effect = '''Addresses of visited sites are not sent to Brave Search.'''
versions = '''Brave policies; they take effect if Brave is installed.'''

["brave.translate-off"]
title = '''Brave: do not offer page translation'''
summary = '''Brave does not offer to translate a page written in another language.'''
effect = '''Page text is not sent to a cloud translation service.'''
risk = '''Employees who read foreign-language websites lose built-in translation.'''
versions = '''Brave policies; they take effect if Brave is installed.'''

["brave.tor-off"]
title = '''Brave: block Tor windows'''
summary = '''Private windows connected to the Tor network are unavailable in Brave.'''
effect = '''Browser traffic does not go to the Tor network, bypassing the organization's filtering and logs.'''
versions = '''Brave policies; they take effect if Brave is installed.'''

