# English translations of the rule catalog texts (rules/NN-*.toml).
# Table key: rule id; _groups: group titles and summaries.
# Fields: title, summary, effect, risk, versions, verify, rollback; params.<name>; values.<name>."<value>".
# When a rule text changes in the catalog, change the translation too; tests/test_docs.py checks completeness.

["install.bypass-tpm"]
title = '''Bypass the TPM 2.0 check'''
summary = '''Setup does not require TPM 2.0. On PCs that have a TPM, the module stays enabled and in use.'''
effect = '''Installation proceeds on PCs without a TPM or with TPM 1.2, with no incompatibility message.'''
risk = '''Without a TPM, automatic device encryption and BitLocker without a startup password are unavailable. Microsoft does not guarantee updates for unsupported PCs.'''
versions = '''LabConfig keys work only in Windows 11 Setup (21H2 and later); Windows 10 ignores them.'''
rollback = '''Remove the rule; it does not affect the installed system.'''

["install.bypass-secureboot"]
title = '''Bypass the Secure Boot check'''
summary = '''Setup does not require Secure Boot to be enabled.'''
effect = '''Installation proceeds on PCs with BIOS/CSM or with Secure Boot turned off.'''
risk = '''Without Secure Boot, Credential Guard and some kernel protections do not work; LSA protection in this file is configured without a UEFI lock precisely for such PCs.'''
versions = '''Windows 11 Setup only.'''

["install.bypass-cpu"]
title = '''Bypass the processor check'''
summary = '''Setup does not check the processor against the list of supported models.'''
effect = '''Installation proceeds on processors older than 8th generation Intel and Ryzen 2000.'''
risk = '''In 24H2 the POPCNT and SSE4.2 instruction requirement cannot be bypassed: installation is impossible on very old processors.'''
versions = '''Windows 11 Setup only.'''

["install.bypass-ram"]
title = '''Bypass the memory check'''
summary = '''Setup does not require 4 GB of memory.'''
effect = '''Installation proceeds on PCs with less memory; the system will run slowly.'''
versions = '''Windows 11 Setup only.'''

["install.bypass-storage"]
title = '''Bypass the disk size check'''
summary = '''Setup does not require 64 GB of disk space.'''
effect = '''Installation proceeds on small disks; free space for updates must be monitored.'''
versions = '''Windows 11 Setup only.'''

["install.bypass-nro"]
title = '''Allow completing OOBE without internet access and a Microsoft account'''
summary = '''BypassNRO key: the out-of-box experience does not require a network connection or a Microsoft account.'''
effect = '''A safeguard: accounts are created from the file, but if OOBE behavior changes, the key keeps setup from getting stuck on the network screen.'''
versions = '''Windows 11 21H2 and later. Microsoft announced the removal of the bypasses in 2025 Insider builds; the key works on released 24H2 and 25H2.'''
verify = '''reg query HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\OOBE /v BypassNRO'''
rollback = '''Delete the value; it does not affect the installed system.'''

["install.netfx3"]
title = '''.NET Framework 3.5 from the installation media'''
summary = '''Searches connected drives for the sources\sxs folder and enables .NET Framework 3.5 (including 2.0 and 3.0) without internet access.'''
effect = '''Legacy accounting software, client-bank apps and drivers for digital signature keys work right after installation.'''
risk = '''The media must stay connected during the first restart; otherwise the component is not installed and a WARN entry is written to the log. It can be added later through Settings when internet access is available.'''
versions = '''The sources\sxs folder is present in all official Windows 10 and 11 ISOs; it may be missing from stripped-down images.'''
verify = '''Get-WindowsOptionalFeature -Online -FeatureName NetFx3'''
rollback = '''Disable-WindowsOptionalFeature -Online -FeatureName NetFx3'''

["oobe.hide-eula"]
title = '''Hide the license agreement screen'''
summary = '''The license is accepted in Setup (AcceptEula), so the screen is not shown in OOBE.'''
effect = '''One screen fewer; the organization is responsible for accepting the terms.'''

["oobe.hide-oem-registration"]
title = '''Hide the manufacturer registration screen'''
summary = '''The OEM registration screen is not shown (it appears only on manufacturer images).'''
effect = '''Harmless on Microsoft images; saves a screen on OEM images.'''

["oobe.hide-online-account"]
title = '''Hide the Microsoft account screens'''
summary = '''The screens for signing in with a Microsoft account and creating a local account are not shown: accounts are defined in the file.'''
effect = '''After setup, the system goes straight to the sign-in screen with the initial accounts.'''
risk = '''Works only together with the accounts in the "Accounts" section; without them, OOBE will require creating an account.'''

["oobe.hide-wireless"]
title = '''Hide the network connection screen'''
summary = '''The "Let's connect you to a network" screen is always hidden, not only on a wired connection.'''
effect = '''Setup does not stop on laptops without a network cable; Wi-Fi is configured after sign-in.'''

["oobe.protect-your-pc"]
title = '''Privacy settings screen: turn off express settings'''
summary = '''The privacy screen is not shown; diagnostic data sending, advertising and location are turned off by default.'''
effect = '''SmartScreen and Defender are not affected: they are enabled by separate rules.'''
versions = '''Value 3 works on Windows 10 and 11, including 24H2.'''
params.mode = '''Mode'''
values.mode."3" = '''Turn off all express settings'''
values.mode."1" = '''Turn on express settings (data sending)'''

["printing.spooler-automatic"]
title = '''Print Spooler starts automatically'''
summary = '''The Spooler service is set to automatic startup (registry and Set-Service); PrintNotify stays manual.'''
effect = '''Printing works right after installation: USB and network printers, "Print to PDF". The original UnattendedWinstall file set the service to manual, and printing did not work.'''
risk = '''Print Spooler has historically been a source of vulnerabilities (PrintNightmare); this is mitigated by the rule that restricts driver installation to administrators and by the firewall.'''
versions = '''No changes across versions. 24H2 has Windows Protected Print mode (WPP); it is not enabled because older printers require their own drivers.'''
verify = '''Get-Service Spooler | Select-Object Status, StartType'''
rollback = '''Set-Service Spooler -StartupType Manual'''

["printing.point-and-print-admins"]
title = '''Only administrators can install printer drivers'''
summary = '''Point and Print policy: installing and updating printer drivers requires administrator rights and shows a warning.'''
effect = '''A standard user cannot install a printer driver; drivers that are already installed and class drivers are available to everyone.'''
risk = '''An administrator must connect a network printer that needs a new driver. While Admin has a blank password, the credential prompt in a user session will not succeed.'''
versions = '''Windows default since August 2021 (KB5005652); the rule enforces it through policy.'''
verify = '''Get-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\PointAndPrint' '''
rollback = '''RestrictDriverInstallationToAdministrators = 0 (reopens the PrintNightmare attack vector).'''

["update.unblock"]
title = '''Remove all Windows Update blocks'''
summary = '''Removes policies that turn off updates, driver updates or Store automatic updates, and returns disabled update services to manual startup.'''
effect = '''Changes nothing on a clean image; removes leftovers of third-party "optimizers" and makes it safe to run the script again.'''
versions = '''No changes.'''
verify = '''Get-ItemProperty HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'''

["update.automatic"]
title = '''Automatic update installation and active hours'''
summary = '''Updates are downloaded and installed automatically; automatic restarts are not allowed during active hours.'''
effect = '''Restarts happen at night or before the workday starts; the user sees a notification and can postpone within the policy limits.'''
risk = '''Active hours cannot exceed 18 hours. PCs that run around the clock will restart outside active hours.'''
versions = '''Works on Windows 10 and 11; in 24H2 fixed hours replace automatic detection of active hours.'''
verify = '''Get-ItemProperty HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'''
rollback = '''Delete SetActiveHours, ActiveHoursStart, ActiveHoursEnd.'''
params.start = '''Active hours start (hour)'''
params.end = '''Active hours end (hour)'''

["update.other-microsoft-products"]
title = '''Updates for other Microsoft products (Office, .NET)'''
summary = '''Opts in to Microsoft Update: fixes for Office (MSI), .NET and other products arrive together with Windows updates.'''
effect = '''The toggle in Settings is turned on and locked. Office 365 (Click-to-Run) updates independently through its own mechanism.'''
versions = '''No changes.'''
verify = '''(New-Object -ComObject Microsoft.Update.ServiceManager).Services | Where-Object IsDefaultAUService'''

["update.defer-feature"]
title = '''Defer feature updates'''
summary = '''Annual version updates arrive with a delay; monthly security updates are not deferred.'''
effect = '''During the deferral period, Microsoft fixes the bugs of the first weeks and accounting software vendors release compatible versions.'''
risk = '''Requires working compatibility assessment: the minimal telemetry rule intentionally leaves DiagTrack on manual startup instead of disabling it.'''
versions = '''Windows 10 1703+ and Windows 11 Pro/Enterprise; Home has no deferral. Range 0-365 days.'''
verify = '''Get-ItemProperty HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate | Select-Object DeferFeatureUpdatesPeriodInDays'''
rollback = '''Delete DeferFeatureUpdates and DeferFeatureUpdatesPeriodInDays.'''
params.days = '''Deferral period, days'''

["update.delivery-optimization-lan"]
title = '''Delivery Optimization: share updates only on the local network'''
summary = '''PCs on the same network share downloaded update fragments with each other; nothing is uploaded outside the network.'''
effect = '''In an office with a dozen PCs, an update is downloaded from the internet only once. Port 7680 must be open between PCs (Windows creates the firewall rule itself).'''
versions = '''Modes 0 (HTTP only), 1 (local network), 3 (internet) and 99 (simple mode) have been the same since Windows 10 1607.'''
verify = '''Get-DOConfig'''
params.mode = '''Mode'''
values.mode."1" = '''Local network only'''
values.mode."0" = '''HTTP only, no peer sharing'''
values.mode."99" = '''Simple mode without the cloud'''

["defender.realtime"]
title = '''Real-time protection enabled and enforced'''
summary = '''Removes the values that third-party scripts use to disable Defender, and enforces real-time protection, behavior monitoring, and scanning of downloads and scripts.'''
effect = '''The antivirus cannot be turned off through the registry; the toggles in Windows Security are managed by policy.'''
versions = '''No changes; Tamper Protection additionally prevents the protection from being weakened.'''
verify = '''Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, BehaviorMonitorEnabled'''

["defender.cloud"]
title = '''Cloud protection: MAPS, sample submission, block level'''
summary = '''MAPS membership at the "Advanced" level, automatic submission of safe samples, "High" cloud block level, and waiting up to 50 seconds for a verdict.'''
effect = '''New malicious files without signatures are blocked by cloud reputation within seconds; a suspicious file is held for up to a minute before its first run.'''
risk = '''The "High" level increases false positives on rare in-house programs; the fix is a file exclusion or level 0. Requires internet access.'''
versions = '''Windows 10 1607 (block level) and 1703 (timeout); no changes in 24H2.'''
verify = '''Get-MpPreference | Select-Object MAPSReporting, SubmitSamplesConsent, CloudBlockLevel, CloudExtendedTimeout'''
rollback = '''Delete the four values; Defender returns to its defaults.'''
params.block_level = '''Cloud block level'''
values.block_level."2" = '''High'''
values.block_level."0" = '''Default'''
values.block_level."4" = '''High plus (more false positives)'''
values.block_level."6" = '''Zero tolerance (blocks everything unknown)'''
params.timeout = '''Extended wait for the cloud verdict, seconds'''

["defender.pua"]
title = '''Block potentially unwanted apps (PUA)'''
summary = '''Defender blocks adware, bundling installers, miners and "optimizers" on download and launch.'''
effect = '''Closes the most common infection channel for non-professional users: "a free program from a website with a Download button".'''
risk = '''Legitimate utilities flagged as PUA (some remote access tools) require an exclusion.'''
versions = '''Policy since Windows 10 1607; toggle in Settings since 2004.'''
verify = '''Get-MpPreference | Select-Object PUAProtection'''
rollback = '''Delete the PUAProtection value.'''

["defender.network-protection"]
title = '''Network protection: block connections to dangerous addresses'''
summary = '''No app, not just Edge, can connect to domains that have a poor reputation according to SmartScreen.'''
effect = '''Phishing sites and command-and-control servers are blocked with a "Connection blocked" notification.'''
risk = '''Works only when Defender is the primary antivirus; may conflict with VPN clients that have their own filters (use audit mode in that case).'''
versions = '''Windows 10 1709+.'''
verify = '''Get-MpPreference | Select-Object EnableNetworkProtection'''
params.mode = '''Mode'''
values.mode."1" = '''Block'''
values.mode."2" = '''Audit (log only)'''

["defender.asr"]
title = '''Attack surface reduction (ASR) rules engine enabled'''
summary = '''Enables the ASR engine; the rules themselves are listed in a subgroup and configured one by one.'''
effect = '''Without this rule, no ASR rule takes effect.'''
versions = '''Available in all editions with Defender (including Home); managed only through policies or PowerShell.'''
verify = '''Get-MpPreference | Select-Object AttackSurfaceReductionRules_Ids'''

["asr.vulnerable-drivers"]
title = '''ASR: block abuse of exploited vulnerable signed drivers'''
summary = '''Prevents drivers from the Microsoft vulnerable driver list from being written to disk (the BYOVD technique used to disable antivirus).'''
effect = '''Drivers that are already installed are not affected.'''
risk = '''Low: old RGB lighting and overclocking utilities.'''
versions = '''Windows 10 1709+.'''
params.mode = '''Mode'''
values.mode."1" = '''Block'''
values.mode."2" = '''Audit'''
values.mode."6" = '''Warn'''

["asr.wmi-persistence"]
title = '''ASR: block persistence through WMI event subscriptions'''
summary = '''Fileless malware cannot establish persistence in the WMI repository.'''
effect = '''Closes a hidden autostart technique.'''
risk = '''Low; interferes with the SCCM client, which is not present in a workgroup.'''
versions = '''Windows 10 1903+.'''
params.mode = '''Mode'''
values.mode."1" = '''Block'''
values.mode."2" = '''Audit'''
values.mode."6" = '''Warn'''

["asr.adobe-reader-child"]
title = '''ASR: Adobe Reader cannot create child processes'''
summary = '''An exploit in a PDF cannot launch anything from Adobe Reader.'''
effect = '''Opening PDF files works as before.'''
risk = '''Low.'''
versions = '''Windows 10 1809+.'''
params.mode = '''Mode'''
values.mode."1" = '''Block'''
values.mode."2" = '''Audit'''
values.mode."6" = '''Warn'''

["asr.office-child"]
title = '''ASR: Office apps cannot create child processes'''
summary = '''A macro in Word or Excel cannot launch cmd, PowerShell or an installer.'''
effect = '''Applies only if Office is installed in Program Files.'''
risk = '''Medium: add-ins that launch external programs.'''
versions = '''Windows 10 1709+.'''
params.mode = '''Mode'''
values.mode."1" = '''Block'''
values.mode."2" = '''Audit'''
values.mode."6" = '''Warn'''

["asr.email-executable"]
title = '''ASR: block executable content from email client and webmail'''
summary = '''.exe, .js and .zip files saved from Outlook and webmail do not run.'''
effect = '''Stops attachments that act as downloaders.'''
risk = '''Low.'''
versions = '''Windows 10 1709+.'''
params.mode = '''Mode'''
values.mode."1" = '''Block'''
values.mode."2" = '''Audit'''
values.mode."6" = '''Warn'''

["asr.obfuscated-scripts"]
title = '''ASR: block execution of obfuscated scripts'''
summary = '''PowerShell, JS and VBS scripts that show signs of obfuscation do not run. Requires cloud protection.'''
effect = '''Stops downloaders that hide their code from antivirus.'''
risk = '''Medium: some program installers use obfuscation.'''
versions = '''Windows 10 1709+.'''
params.mode = '''Mode'''
values.mode."1" = '''Block'''
values.mode."2" = '''Audit'''
values.mode."6" = '''Warn'''

["asr.script-download"]
title = '''ASR: JavaScript and VBScript cannot launch downloaded content'''
summary = '''A downloader script cannot launch a file it has just downloaded.'''
effect = '''The typical "archive with a script inside" scheme stops working.'''
risk = '''Low.'''
versions = '''Windows 10 1709+.'''
params.mode = '''Mode'''
values.mode."1" = '''Block'''
values.mode."2" = '''Audit'''
values.mode."6" = '''Warn'''

["asr.office-executable"]
title = '''ASR: Office cannot create executable files'''
summary = '''Macros cannot write .exe, .dll or .vbs files to disk.'''
effect = '''Closes persistence through documents.'''
risk = '''Low.'''
versions = '''Windows 10 1709+.'''
params.mode = '''Mode'''
values.mode."1" = '''Block'''
values.mode."2" = '''Audit'''
values.mode."6" = '''Warn'''

["asr.office-injection"]
title = '''ASR: Office cannot inject code into other processes'''
summary = '''Word, Excel, PowerPoint and OneNote cannot inject code into other processes.'''
effect = '''There is no legitimate reason for such injection.'''
risk = '''Low; incompatible with BeyondTrust Privilege Guard and Heimdal. Warn mode is not supported.'''
versions = '''Windows 10 1709+.'''
params.mode = '''Mode'''
values.mode."1" = '''Block'''
values.mode."2" = '''Audit'''

["asr.office-comm-child"]
title = '''ASR: Outlook cannot create child processes'''
summary = '''Protects against exploits of Outlook rules and forms when credentials have been stolen.'''
effect = '''Regular Outlook features keep working.'''
risk = '''Low.'''
versions = '''Windows 10 1709+.'''
params.mode = '''Mode'''
values.mode."1" = '''Block'''
values.mode."2" = '''Audit'''
values.mode."6" = '''Warn'''

["asr.usb-untrusted"]
title = '''ASR: block untrusted and unsigned programs from USB'''
summary = '''Unsigned .exe, .dll and .scr files do not run directly from USB flash drives and SD cards.'''
effect = '''Copying files from a USB flash drive is not blocked, only running them.'''
risk = '''Medium: unsigned portable utilities.'''
versions = '''Windows 10 1709+.'''
params.mode = '''Mode'''
values.mode."1" = '''Block'''
values.mode."2" = '''Audit'''
values.mode."6" = '''Warn'''

["asr.office-win32-api"]
title = '''ASR: block Win32 API calls from Office macros'''
summary = '''VBA macros cannot call the Win32 API (shellcode that is never written to disk).'''
effect = '''Regular macros do not need such calls.'''
risk = '''Low.'''
versions = '''Windows 10 1709+.'''
params.mode = '''Mode'''
values.mode."1" = '''Block'''
values.mode."2" = '''Audit'''
values.mode."6" = '''Warn'''

["asr.ransomware"]
title = '''ASR: use advanced protection against ransomware'''
summary = '''Files that resemble ransomware according to cloud heuristics and have no positive reputation are blocked. Requires cloud protection.'''
effect = '''An additional layer on top of signatures and behavior monitoring.'''
risk = '''Medium: rare in-house programs are blocked until they build a reputation.'''
versions = '''Windows 10 1803+.'''
params.mode = '''Mode'''
values.mode."1" = '''Block'''
values.mode."2" = '''Audit'''
values.mode."6" = '''Warn'''

["asr.safe-mode-reboot"]
title = '''ASR: block programs from restarting the PC in safe mode'''
summary = '''Malicious code cannot put the PC into safe mode, where the antivirus does not run.'''
effect = '''Safe mode is still available from the recovery environment.'''
risk = '''Low.'''
versions = '''Windows 10 1709+.'''
params.mode = '''Mode'''
values.mode."1" = '''Block'''
values.mode."2" = '''Audit'''
values.mode."6" = '''Warn'''

["asr.copied-system-tools"]
title = '''ASR: warn about copied or impersonated system tools'''
summary = '''Copies of system32 utilities that run from other folders are blocked, with an option to allow them.'''
effect = '''Warn mode by default because the rule is heuristic.'''
risk = '''Elevated: legitimate programs that have system utility names and run from non-standard paths.'''
versions = '''Windows 10 1709+.'''
params.mode = '''Mode'''
values.mode."6" = '''Warn'''
values.mode."1" = '''Block'''
values.mode."2" = '''Audit'''

["asr.prevalence"]
title = '''ASR: executable files without a reputation (audit)'''
summary = '''Launches of rare or new .exe files are logged (audit). In block mode, the rule would shut out the organization's internal programs.'''
effect = '''Event 1122 in the Defender log shows what would have been blocked.'''
risk = '''High in block mode: in-house programs without a reputation. Enable it in the Strict profile after a month of auditing.'''
versions = '''Windows 10 1803+.'''
params.mode = '''Mode'''
values.mode."2" = '''Audit'''
values.mode."6" = '''Warn'''
values.mode."1" = '''Block'''

["asr.psexec-wmi"]
title = '''ASR: processes created by PsExec and WMI (audit)'''
summary = '''Remote execution through PsExec and WMI is logged. In block mode, the rule would interfere with remote administration by your own IT specialist.'''
effect = '''Auditing reveals attempts at lateral movement across the network.'''
risk = '''High in block mode if administration relies on PsExec/WMI.'''
versions = '''Windows 10 1803+.'''
params.mode = '''Mode'''
values.mode."2" = '''Audit'''
values.mode."6" = '''Warn'''
values.mode."1" = '''Block'''

["asr.lsass"]
title = '''ASR: block credential stealing from LSASS'''
summary = '''Duplicates the LSA protection rule (RunAsPPL) and produces a lot of noise in the log; off by default.'''
effect = '''Makes sense only where LSA protection cannot be enabled (unsigned smart card plug-ins).'''
risk = '''Many events from legitimate programs (the Chrome updater and others). Warn mode is not supported.'''
versions = '''Windows 10 1803+.'''
params.mode = '''Mode'''
values.mode."1" = '''Block'''
values.mode."2" = '''Audit'''

["defender.controlled-folder-access"]
title = '''Controlled Folder Access (mode)'''
summary = '''Sets the protection mode for the Documents, Pictures and Desktop folders. The default is 0 (off), set as a policy so the user cannot turn it on by accident.'''
effect = '''In block mode, only trusted apps can write to protected folders; ransomware launched by the user cannot damage documents.'''
risk = '''Mode 1 breaks accounting software (1C, M.E.Doc, client-bank apps), older versions of Office and any in-house programs that write to Documents. Recommended path: a month in audit mode (2), review of events 1123/1124, then block mode.'''
versions = '''Windows 10 1709+.'''
verify = '''Get-MpPreference | Select-Object EnableControlledFolderAccess'''
rollback = '''Value 0.'''
params.mode = '''Mode'''
values.mode."0" = '''Off'''
values.mode."2" = '''Audit'''
values.mode."1" = '''Block (breaks older programs)'''

["defender.notifications"]
title = '''Windows Security notifications are shown'''
summary = '''Security Center notification policies are enforced in the enabled state.'''
effect = '''The user sees messages about threats and scan results. The original UnattendedWinstall file turned off all notifications.'''
versions = '''No changes.'''

["defender.smartscreen-shell"]
title = '''SmartScreen for downloaded programs and files'''
summary = '''Running a program downloaded from the internet that has no reputation shows a warning (Warn) or is blocked (Block).'''
effect = '''Works based on the Internet zone mark; files from USB flash drives and the local network are not checked (they are covered by the ASR rule for USB and by cloud protection).'''
risk = '''Block mode prevents installing any uncommon program, including accounting software from developer websites.'''
versions = '''ShellSmartScreenLevel policy since Windows 10 1703.'''
verify = '''Windows Security -> App & browser control -> Check apps and files'''
rollback = '''Delete ShellSmartScreenLevel; the default Warn remains, but the user will be able to turn it off.'''
params.level = '''Level'''
values.level."Warn" = '''Warn'''
values.level."Block" = '''Block'''

["uac.baseline"]
title = '''UAC enabled, prompts on the secure desktop, Win+L works'''
summary = '''Baseline UAC values: enabled, prompts on the secure desktop, standard users enter administrator credentials, installers require elevation, the built-in Administrator runs in Admin Approval Mode, and network logons of local administrators get a filtered token. The ban on locking the screen is removed.'''
effect = '''The original UnattendedWinstall file blocked Win+L locking and removed UAC prompts; here it is the opposite.'''
versions = '''The values have been the same since Windows Vista.'''
verify = '''Get-ItemProperty HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'''

["uac.admin-always-notify"]
title = '''UAC for administrators: always notify'''
summary = '''The administrator sees a prompt for every elevation, including system components; this closes known UAC bypasses through trusted Windows programs.'''
effect = '''More "Yes/No" prompts for Admin; protection against automatic elevation by malicious code.'''
risk = '''With a blank password, a UAC prompt is just a "Yes" button: it protects against programs, not against the person at the keyboard.'''
versions = '''The values have been the same since Windows Vista.'''
verify = '''Control Panel -> User Accounts -> Change User Account Control settings'''
rollback = '''Value 5 (Windows default).'''
params.level = '''Level'''
values.level."2" = '''Always notify'''
values.level."5" = '''Only for third-party programs (Windows default)'''

["accounts.inactivity-lock"]
title = '''Lock the screen after inactivity'''
summary = '''After the specified number of seconds without input, the screen locks regardless of screen saver and power settings.'''
effect = '''The workstation is not left open; with a blank password, unlocking is just pressing Enter, so the rule becomes meaningful once passwords are assigned.'''
versions = '''Policy since Windows 8; maximum 599940 seconds.'''
verify = '''Get-ItemProperty HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System -Name InactivityTimeoutSecs'''
rollback = '''Delete the value.'''
params.seconds = '''Seconds of inactivity before locking'''

["lsa.baseline"]
title = '''Basic credential protection: no LM hashes, no anonymous access, no WDigest, SEHOP'''
summary = '''LM hashes are not stored; accounts with blank passwords are limited to console logon; anonymous enumeration of shares and accounts is not allowed; passwords are not kept in memory in plain text (WDigest); Structured Exception Handler Overwrite Protection (SEHOP) is enabled.'''
effect = '''A stolen hash or memory dump becomes of little use.'''
risk = '''Very old devices (printers, NAS) that browse shares anonymously may not see them.'''
versions = '''Most values match the Windows 10/11 defaults and are set explicitly; RestrictAnonymous=1 is stricter than the client Windows default.'''
verify = '''Get-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'''

["lsa.protection"]
title = '''LSA protection (RunAsPPL): LSASS as a protected process'''
summary = '''LSASS memory is inaccessible to other processes, even with administrator rights; hashes and passwords cannot be extracted.'''
effect = '''Mimikatz and dumps through Task Manager do not work. Value 2 has no UEFI lock, so it can be rolled back through the registry.'''
risk = '''Plug-ins loaded into LSA (digital signature token drivers, third-party sign-in providers) must be signed by Microsoft; unsigned ones will not load (events 3033/3063). Test the organization's digital signature keys before a broad rollout.'''
versions = '''Value 2 is recognized by Windows 11 22H2 and later; Windows 10 treats any non-zero value as 1 (with a UEFI lock).'''
verify = '''System log, event 12 from WinInit; Get-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Control\Lsa -Name RunAsPPL'''
rollback = '''Delete the value or set it to 0, then restart.'''
params.mode = '''Mode'''
values.mode."2" = '''Enabled without a UEFI lock (reversible)'''
values.mode."1" = '''Enabled with a UEFI lock (irreversible without firmware access)'''

["lsa.ntlmv2-only"]
title = '''NTLMv2 only (refuse LM and NTLMv1)'''
summary = '''The client and server use only NTLMv2 and refuse LM and NTLMv1.'''
effect = '''Intercepted hashes cannot be used in old NTLMv1 attacks; modern PCs and NAS devices are not affected.'''
risk = '''Very old NAS devices, printers with scan to folder, and embedded devices that use NTLMv1 will stop connecting. Relax it together with the SMB rules after an inventory.'''
versions = '''Without the key, the Windows 10/11 default is 3; in 24H2 Microsoft started phasing out NTLM.'''
verify = '''Get-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Control\Lsa -Name LmCompatibilityLevel'''
rollback = '''Value 3, or delete it.'''

["accounts.lockout"]
title = '''Lock out accounts after wrong passwords'''
summary = '''After the specified number of consecutive wrong passwords, the account is locked for the specified time.'''
effect = '''Password guessing over the network (SMB, RDP) becomes useless. Not relevant while passwords are blank; once passwords are assigned, it is the first line of defense.'''
