verify = '''Get-Service DiagTrack | Select-Object StartType; schtasks /Query /TN "\Microsoft\Windows\Customer Experience Improvement Program\UsbCeip"'''
rollback = '''Видалити значення; Set-Service DiagTrack -StartupType Automatic; schtasks /Change /Enable'''
params.level = '''Рівень діагностичних даних'''
values.level."1" = '''Обов'язкові: мінімум, який Windows 11 Pro надсилає завжди'''
values.level."0" = '''Безпека: лише Enterprise і Education, у Pro діє як «Обов'язкові»'''

["privacy.consumer-content"]
title = '''Без реклами, передвстановлень і автовстановлення Teams (політики комп'ютера)'''
summary = '''Політики CloudContent (частина діє лише в Enterprise/Education і залишена як нешкідлива), значок чату Teams приховано, автовстановлення особистого Teams вимкнено.'''
effect = '''Головний робочий механізм у Pro це значення в типовому профілі користувача (окреме правило в групі профілю), ця частина закріплює те саме на рівні комп'ютера.'''
versions = '''DisableWindowsConsumerFeatures, DisableSoftLanding, DisableThirdPartySuggestions лише Enterprise/Education; DisableCloudOptimizedContent (10 20H2+) працює в Pro, DisableConsumerAccountStateContent (11 22H2+) у Pro виробником не підтверджено; Windows Chat стосується 11 21H2-22H2.'''
