["encryption.prevent-auto-bitlocker"]
title = '''Заборонити автоматичне шифрування пристрою (BitLocker без ключа)'''
summary = '''Windows не шифрує системний диск автоматично. Без домену й облікового запису Microsoft ключ відновлення нікуди зберегти.'''
effect = '''Клонування й відновлення диска працюють; у разі збою TPM дані не втрачаються. Захист ноутбука від крадіжки вмикається свідомо зі збереженням ключа.'''
risk = '''Дані на викраденому ноутбуці не захищені шифруванням, доки BitLocker не ввімкнено вручну.'''
versions = '''Windows 11 24H2 після чистого встановлення шифрує диск на будь-якому ПК з TPM; 23H2 і старіші лише на пристроях із Modern Standby. Ключ діє з Windows 8.1.'''
verify = '''Get-BitLockerVolume C: | Select-Object ProtectionStatus, VolumeStatus'''
rollback = '''Видалити значення, потім Параметри -> Конфіденційність і захист -> Шифрування пристрою.'''

["accounts.block-aad-join"]
title = '''Без запиту «Дозволити організації керувати пристроєм»'''
summary = '''Під час входу в Office або Teams з робочим обліковим записом Windows не пропонує приєднати пристрій до Entra ID.'''
effect = '''Непрофесійний користувач не підключить ПК до чужого хмарного керування одним клацанням.'''
versions = '''Без змін.'''

["network.smb1-off"]
title = '''SMB1 вимкнено й видалено'''
summary = '''Сервер не відповідає через SMB1, клієнтський драйвер вимкнено, компонент SMB1Protocol видалено, якщо його встановлено.'''
effect = '''Протокол 1996 року, через який поширювалися WannaCry і NotPetya, повністю відсутній.'''
risk = '''Пристрої лише з SMB1 (БФП зі скануванням у мережеву папку до 2015 року, старі NAS, Windows XP) не під'єднаються. Рішення: мікропрограма з SMB2/3, сканування на FTP або електронну пошту.'''
versions = '''Windows 11 24H2 взагалі не містить SMB1 (WARN у журналі щодо драйвера очікуване); у Windows 10 1709+ і 11 до 23H2 компонент не встановлено, але він доступний; у Windows 10 до 1709 встановлено.'''
verify = '''Get-SmbServerConfiguration | Select-Object EnableSMB1Protocol'''
rollback = '''Не рекомендовано; Enable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol на збірках, де він є.'''

["network.smb-signing"]
title = '''Підпис SMB обов'язковий (сервер і клієнт)'''
summary = '''Кожен пакет SMB підписано; ретрансляція NTLM і підміна трафіку спільних папок неможливі.'''
effect = '''ПК робочої групи, налаштовані цим файлом, сумісні між собою; продуктивність у гігабітній мережі знижується на кілька відсотків.'''
risk = '''Старі NAS і БФП без підтримки підпису SMB2 не під'єднаються. Послаблювати разом із правилами SMB1 і NTLMv2 після інвентаризації.'''
versions = '''Windows 11 24H2 і Server 2025 вимагають підпис за замовчуванням у Pro та Enterprise; правило робить це явно й для Windows 10 та 11 до 23H2.'''
verify = '''Get-SmbServerConfiguration | Select-Object RequireSecuritySignature; Get-SmbClientConfiguration | Select-Object RequireSecuritySignature'''
rollback = '''Set-SmbServerConfiguration -RequireSecuritySignature $false; Set-SmbClientConfiguration -RequireSecuritySignature $false'''

["network.llmnr-off"]
title = '''LLMNR вимкнено (захист від підміни імен у мережі)'''
summary = '''Широкомовне опитування імен LLMNR вимкнено; інструменти класу Responder не отримують хеші від цих ПК.'''
effect = '''Імена комп'ютерів робочої групи й надалі розпізнаються через NetBIOS (залишено ввімкненим) і mDNS.'''
versions = '''Політика з Windows Vista; у 24H2 Microsoft оголосила LLMNR застарілим на користь mDNS.'''
verify = '''Get-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient' -Name EnableMulticast'''
rollback = '''Видалити значення.'''

["network.netbios-off"]
title = '''NetBIOS over TCP/IP вимкнено'''
summary = '''Закриває другий канал підміни імен (NBT-NS) і порти 137-139 на всіх поточних інтерфейсах.'''
effect = '''Без домену й WINS ім'я вигляду \\PC-BUH розпізнається лише через mDNS (pc-buh.local) або DNS маршрутизатора; звичні ярлики спільних папок можуть перестати працювати.'''
risk = '''Інтерфейси, додані після встановлення (новий адаптер Wi-Fi, VPN), отримають типове значення. Вмикати лише після перевірки в конкретній мережі.'''
versions = '''Значення однакові з Windows 2000; у 24H2 NetBIOS за замовчуванням увімкнено.'''
verify = '''Get-CimInstance Win32_NetworkAdapterConfiguration | Select-Object Description, TcpipNetbiosOptions'''
rollback = '''NetbiosOptions = 0 для інтерфейсів, NodeType видалити.'''

["network.firewall"]
title = '''Брандмауер увімкнено на всіх профілях, вхідні блокуються, журнал відкинутих пакетів'''
summary = '''Політика для доменного, приватного й загальнодоступного профілів: брандмауер увімкнено і його не можна вимкнути з Панелі керування, вхідні за замовчуванням блокуються, вихідні дозволено, відкинуті пакети записуються у файл 16 МБ.'''
effect = '''Дозвільні правила (спільний доступ до файлів і принтерів, Delivery Optimization, mDNS) і далі працюють; під час розслідування видно, хто стукав на які порти.'''
risk = '''Профіль мережі (приватна/загальнодоступна) файл не задає; спільний доступ до папок потребує приватного профілю.'''
versions = '''Політика однакова з Windows Vista.'''
verify = '''Get-NetFirewallProfile | Select-Object Name, Enabled, DefaultInboundAction, LogBlocked'''
rollback = '''Видалити ключі профілів у HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall.'''

["removable.autorun-off"]
title = '''Автозапуск і автовідтворення вимкнено для всіх носіїв'''
summary = '''Автозапуск вимкнено для всіх типів дисків, файли autorun.inf ігноруються навіть на CD, автовідтворення вимкнено для пристроїв без літери диска (телефони, камери).'''
effect = '''Під'єднання флешки, диска чи телефона нічого не запускає і нічого не питає. Ручний запуск файлу охоплює правило ASR для USB.'''
versions = '''З Windows 7 autorun.inf на USB завжди ігнорується; для CD ще працює, тому NoAutorun потрібен.'''
verify = '''Get-ItemProperty HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'''
rollback = '''Видалити три значення.'''

["scripts.open-in-notepad"]
title = '''Файли скриптів (.js .vbs .hta та інші) відкриваються в Блокноті'''
summary = '''Подвійне клацання на .js, .jse, .vbs, .vbe, .wsf, .wsh, .hta показує текст у Блокноті, а не виконує його.'''
effect = '''Класичний фішинг «архів зі скриптом усередині» (рахунок.pdf.js) не спрацьовує. cscript, wscript і mshta з командного рядка та з програм працюють.'''
risk = '''Інсталятори, які запускають .vbs через оболонку (рідко), відкриють Блокнот. Асоціація в профілі користувача (Відкрити за допомогою) має пріоритет над цією.'''
versions = '''ProgId однакові з Windows XP.'''
verify = '''(Get-ItemProperty 'HKLM:\SOFTWARE\Classes\VBSFile\Shell\Open\Command').'(default)' '''
rollback = '''Відновити типові значення, наприклад для VBS: "%SystemRoot%\System32\WScript.exe" "%1" %*'''

["scripts.remove-vbscript"]
title = '''Видалити рушій VBScript'''
summary = '''Інтерпретатор VBScript видаляється як необов'язковий компонент.'''
effect = '''Не працюють ні .vbs, ні макроси VBScript у старих програмах, ні компонент MSScriptControl.'''
risk = '''Інсталятори програм 2000-х, частина драйверів принтерів і старі корпоративні застосунки використовують VBScript. Асоціація з Блокнотом дає більшу частину захисту без збоїв.'''
versions = '''Компонент існує лише в Windows 11 24H2 і новіших; у 23H2 та Windows 10 рушій невіддільний від системи (WARN у журналі).'''
verify = '''Get-WindowsCapability -Online -Name 'VBSCRIPT*' '''
rollback = '''Add-WindowsCapability -Online -Name VBSCRIPT~~~~ (потрібен інтернет або джерело).'''

["edge.smartscreen-locked"]
title = '''SmartScreen в Edge увімкнено, обхід заборонено'''
summary = '''Перевірка сайтів і завантажень за репутацією, блокування небажаних завантажень; користувач не може «перейти на сайт» або «усе одно зберегти» після попередження.'''
effect = '''Edge захищає від фішингу та шкідливих завантажень без можливості обійти попередження одним клацанням.'''
versions = '''Політики Edge 79 і новіших, оновлюються разом із браузером незалежно від версії Windows.'''
verify = '''edge://policy'''
rollback = '''Видалити значення з ключа політик Edge.'''

["edge.baseline"]
title = '''Edge без майстра першого запуску, реклами й фонових процесів'''
summary = '''Приховано майстер першого запуску, вимкнено рекомендації, звіти для персоналізації, прискорений запуск і фоновий режим.'''
effect = '''Edge залишається резервним браузером: без нього не можна завантажити інший браузер. Не показує рекламу й не займає пам'ять у фоні.'''
versions = '''Політики Edge 77 і новіших.'''

["logging.eventlog-sizes"]
title = '''Збільшені журнали подій (Security 256 МБ, System і Application 64 МБ, PowerShell 128 МБ)'''
summary = '''Розміри журналів збільшено з 20 МБ (15 МБ у PowerShell), щоб історія за кілька тижнів не перезаписувалася.'''
effect = '''Без цього правила аудит і журналювання PowerShell стають марними за кілька днів.'''
versions = '''Без змін.'''
verify = '''wevtutil gl Security | findstr maxSize'''
rollback = '''wevtutil sl Security /ms:20971520'''

["logging.audit-policy"]
title = '''Аудит: створення процесів із командним рядком, входи, блокування, облікові записи, знімні носії'''
summary = '''Подія 4688 містить повний командний рядок; увімкнено підкатегорії входу, блокувань, керування обліковими записами й групами, перевірки облікових даних, завдань планувальника і знімних носіїв. Підкатегорії задано за GUID: в українському образі auditpol не приймає англійські імена.'''
effect = '''Під час інциденту за журналом Security відновлюється ланцюжок: який процес, з якими аргументами, від імені якого користувача.'''
risk = '''Аудит знімних носіїв записує багато подій під час копіювання великих папок на флешку.'''
versions = '''Підкатегорія «Знімне сховище» з Windows 8; командний рядок у 4688 з Windows 8.1; GUID однакові в усіх версіях.'''
verify = '''auditpol /get /category:*'''
rollback = '''auditpol /clear'''

["logging.powershell"]
title = '''Журналювання PowerShell: блоки коду та виклики командлетів'''
summary = '''Текст кожного виконуваного блоку коду (подія 4104, включно з деобфускованим кодом) і виклики командлетів усіх модулів (4103) записуються в журнал PowerShell.'''
effect = '''Шкідливі завантажувачі на PowerShell залишають повний текст у журналі навіть після видалення файлу.'''
risk = '''Секрети, передані адміністратором у командному рядку, потрапляють до журналу; доступ до журналу мають лише адміністратори.'''
versions = '''Script Block Logging з Windows 10 / WMF 5.0; діє і для PowerShell 7.'''
verify = '''Get-ItemProperty HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging'''
rollback = '''Видалити два ключі.'''

["logging.powershell-v2-off"]
title = '''PowerShell 2.0 вимкнено'''
summary = '''Старий рушій, який не підтримує журналювання й перевірку антивірусом (AMSI), вимикається як компонент Windows.'''
effect = '''Команда powershell -Version 2 не працює; атаки зі зниженням версії неможливі.'''
versions = '''Компонент є в Windows 10 і Windows 11 до 23H2; у 24H2 (із серпня 2025) і 25H2 рушій видалено з образу, команда запише INFO про його відсутність.'''
verify = '''Get-WindowsOptionalFeature -Online -FeatureName MicrosoftWindowsPowerShellV2Root'''
rollback = '''Enable-WindowsOptionalFeature -Online -FeatureName MicrosoftWindowsPowerShellV2Root'''

["privacy.telemetry-minimal"]
title = '''Мінімальна телеметрія без вимкнення оцінки сумісності'''
summary = '''Рівень діагностичних даних «Обов'язкові» (мінімум для Pro), без запитів відгуків, без імені ПК у даних, рекламний ідентифікатор вимкнено, звіти про збої не надсилаються, журнал дій не збирається, служба DiagTrack у ручному режимі, завдання CEIP і Feedback вимкнено.'''
effect = '''Мінімальне надсилання даних, доступне в Pro. Службу DiagTrack навмисно не вимкнено: вона потрібна для оцінки сумісності під час оновлень функцій і для звітів Defender.'''
risk = '''Звіти про збої до Microsoft не надходять; локальні події 1000/1001 у журналі Application залишаються.'''
versions = '''AllowTelemetry=0 у Pro трактується як 1; завдання Consolidator може бути відсутнє на частині збірок 24H2 (WARN у журналі).'''
verify = '''Get-Service DiagTrack | Select-Object StartType; schtasks /Query /TN "\Microsoft\Windows\Customer Experience Improvement Program\UsbCeip"'''
rollback = '''Видалити значення; Set-Service DiagTrack -StartupType Automatic; schtasks /Change /Enable'''

["privacy.consumer-content"]
title = '''Без реклами, передвстановлень і автовстановлення Teams (політики комп'ютера)'''
summary = '''Політики CloudContent (частина діє лише в Enterprise/Education і залишена як нешкідлива), значок чату Teams приховано, автовстановлення особистого Teams вимкнено.'''
effect = '''Головний робочий механізм у Pro це значення в типовому профілі користувача (окреме правило в групі профілю), ця частина закріплює те саме на рівні комп'ютера.'''
versions = '''DisableWindowsConsumerFeatures, DisableSoftLanding, DisableThirdPartySuggestions лише Enterprise/Education; DisableCloudOptimizedContent (10 20H2+) і DisableConsumerAccountStateContent (11 22H2+) працюють у Pro; Windows Chat стосується 11 21H2-22H2.'''
verify = '''Get-ItemProperty HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent'''
rollback = '''Видалити значення.'''

["privacy.copilot-recall-off"]
title = '''Copilot, Recall і Click to Do вимкнено'''
summary = '''Політики Copilot і WindowsAI: Recall (знімки екрана) вимкнено, і користувач не може його ввімкнути, Click to Do вимкнено; компонент Recall вимикається, якщо він є.'''
effect = '''Жоден ШІ-компонент не робить знімків екрана й не надсилає вміст документів. Застосунок Copilot видаляється окремим правилом у групі застосунків.'''
versions = '''TurnOffWindowsCopilot з 23H2 (у 24H2 визнано застарілим, діє копія в профілі користувача); DisableAIDataAnalysis з 24H2; AllowRecallEnablement і DisableClickToDo з оновлень 2025 року; компонент Recall лише на Copilot+ PC.'''
verify = '''Get-WindowsOptionalFeature -Online -FeatureName Recall'''
rollback = '''Видалити значення.'''

["privacy.widgets-off"]
title = '''Віджети та стрічку новин вимкнено'''
summary = '''Панель віджетів Windows 11 і стрічку «Новини та інтереси» Windows 10 вимкнено політикою.'''
effect = '''Немає кнопки віджетів і постійно відкритої вебсторінки MSN з рекламою; процес Widgets.exe не запускається.'''
versions = '''Політика Dsh з Windows 11 21H2; Windows Feeds для Windows 10 20H1+.'''
verify = '''Параметри -> Персоналізація -> Панель завдань -> Віджети'''
rollback = '''Видалити значення.'''

["privacy.web-search-off"]
title = '''Без вебрезультатів Bing у пошуку меню Пуск'''
summary = '''Пошук у меню Пуск шукає лише застосунки, файли й параметри; під час введення нічого не надсилається в Bing.'''
effect = '''Індексування й пошук у Провіднику та Outlook не зачеплено (служба WSearch залишається без змін).'''
versions = '''DisableSearchBoxSuggestions з Windows 10 2004; Cortana у Windows 11 видалено (політика нешкідлива).'''
verify = '''Пошук у меню Пуск за словом «погода» без вебрезультатів.'''
rollback = '''Видалити значення.'''

["system.long-paths"]
title = '''Підтримка довгих шляхів (понад 260 символів)'''
summary = '''Програми з маніфестом longPathAware (PowerShell 7, Git, сучасні архіватори) працюють зі шляхами, довшими за 260 символів.'''
effect = '''Провідник і старі програми зберігають обмеження; нешкідливо.'''
versions = '''Windows 10 1607+.'''
verify = '''Get-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem -Name LongPathsEnabled'''
rollback = '''Значення 0.'''

["apps.retail-demo-off"]
title = '''Службу демонстраційного режиму магазину вимкнено'''
summary = '''Служба RetailDemo потрібна лише ПК на вітрині магазину.'''
effect = '''На одну фонову службу менше.'''

["apps.xbox-services-off"]
title = '''Служби Xbox і запис ігор (Game DVR) вимкнено'''
summary = '''Служби Xbox Live (автентифікація, збереження, мережа, контролери) вимкнено; політика забороняє запис ігор і Game Bar.'''
effect = '''Немає фонових служб Xbox і запису екрана у фоні, який навантажує слабкі ПК. Ігри зі Store з Xbox Live не працюють.'''
versions = '''XboxGipSvc з Windows 10 1709.'''
verify = '''Get-Service Xbl*, XboxNetApiSvc, XboxGipSvc | Select-Object Name, StartType'''
rollback = '''Set-Service <ім'я> -StartupType Manual; видалити AllowGameDVR.'''

["apps.maps-broker-off"]
title = '''Службу завантаження офлайн-карт вимкнено'''
summary = '''MapsBroker обслуговує застосунок «Карти»; без застосунку служба не потрібна. У файлі v0.2 вимикалася за умови Xbox, тут прив'язана до видалення Карт.'''
effect = '''На одну автоматичну службу менше.'''
rollback = '''Set-Service MapsBroker -StartupType Automatic'''

["apps.remove-quick-assist"]
title = '''Видалити Швидку допомогу (Quick Assist)'''
summary = '''Штатний засіб віддаленого керування, який шахраї «техпідтримки» просять запустити під час телефонної розмови, видаляється (компонент Windows 10 і версія зі Store у Windows 11).'''
effect = '''Для підтримки власним адміністратором організація обирає інструмент сама. Користувач може знову встановити Quick Assist зі Store.'''
versions = '''Компонент App.Support.QuickAssist у Windows 10 1809+ і 11 21H2; з 22H2 застосунок Store.'''
verify = '''Get-WindowsCapability -Online -Name 'App.Support.QuickAssist*' '''
rollback = '''Store -> Швидка допомога, або Add-WindowsCapability -Online -Name App.Support.QuickAssist~~~~0.0.1.0'''

