effect = '''У Windows 11 запис видалено, відома папка залишилася. Правило створює запис в обох гілках; під час першого відкриття папка з'явиться в профілі користувача. Вимкнено за замовчуванням.'''
versions = '''Windows 10 1709-20H2 показували папку самі; у Windows 11 запису немає. Дію в 25H2 перевірте на тестовому ПК.'''
