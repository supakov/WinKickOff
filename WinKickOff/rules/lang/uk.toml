summary = '''Інтерпретатор VBScript видаляється як необов'язковий компонент.'''
effect = '''Не працюють ні .vbs, ні макроси VBScript у старих програмах, ні компонент MSScriptControl.'''
risk = '''Інсталятори програм 2000-х, частина драйверів принтерів і старі корпоративні застосунки використовують VBScript. Асоціація з Блокнотом дає більшу частину захисту без збоїв.'''
versions = '''Компонент існує лише в Windows 11 24H2 і новіших; у 23H2 та Windows 10 рушій невіддільний від системи (WARN у журналі).'''
