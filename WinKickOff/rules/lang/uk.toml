effect = '''На диску не залишається опису облікових записів.'''
versions = '''У Windows 10 зберігалася одна копія, у 24H2 дві.'''
verify = '''Test-Path C:\Windows\Panther\unattend.xml і Test-Path C:\Windows\Panther\unattend-original.xml повертають False.'''
