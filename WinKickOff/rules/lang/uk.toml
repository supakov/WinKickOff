title = '''Заборонити автоматичне шифрування пристрою (BitLocker без ключа)'''
summary = '''Windows не шифрує системний диск автоматично. Без домену й облікового запису Microsoft ключ відновлення нікуди зберегти.'''
effect = '''Клонування й відновлення диска працюють; у разі збою TPM дані не втрачаються. Захист ноутбука від крадіжки вмикається свідомо зі збереженням ключа.'''
risk = '''Дані на викраденому ноутбуці не захищені шифруванням, доки BitLocker не ввімкнено вручну.'''
versions = '''Windows 11 24H2 після чистого встановлення шифрує диск на будь-якому ПК з TPM; 23H2 і старіші лише на пристроях із Modern Standby. Ключ діє з Windows 8.1.'''
verify = '''Get-BitLockerVolume C: | Select-Object ProtectionStatus, VolumeStatus'''
rollback = '''Видалити значення, потім Параметри -> Конфіденційність і захист -> Шифрування пристрою.'''

["accounts.block-aad-join"]
title = '''Без запиту «Дозволити організації керувати пристроєм»'''
summary = '''Під час входу в Office або Teams з робочим обліковим записом Windows не пропонує приєднати пристрій до Entra ID.'''
effect = '''Непрофесійний користувач не підключить ПК до чужого хмарного керування одним клацанням.'''
versions = '''Без змін.'''

["network.smb1-off"]
title = '''SMB1 вимкнено й видалено'''
summary = '''Сервер не відповідає через SMB1, клієнтський драйвер вимкнено, компонент SMB1Protocol видалено, якщо його встановлено.'''
effect = '''Протокол 1996 року, через який поширювалися WannaCry і NotPetya, повністю відсутній.'''
risk = '''Пристрої лише з SMB1 (БФП зі скануванням у мережеву папку до 2015 року, старі NAS, Windows XP) не під'єднаються. Рішення: мікропрограма з SMB2/3, сканування на FTP або електронну пошту.'''
versions = '''Windows 11 24H2 взагалі не містить SMB1 (WARN у журналі щодо драйвера очікуване); у Windows 10 1709+ і 11 до 23H2 компонент не встановлено, але він доступний; у Windows 10 до 1709 встановлено.'''
verify = '''Get-SmbServerConfiguration | Select-Object EnableSMB1Protocol'''
rollback = '''Не рекомендовано; Enable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol на збірках, де він є.'''

["network.smb-signing"]
title = '''Підпис SMB обов'язковий (сервер і клієнт)'''
summary = '''Кожен пакет SMB підписано; ретрансляція NTLM і підміна трафіку спільних папок неможливі.'''
effect = '''ПК робочої групи, налаштовані цим файлом, сумісні між собою; продуктивність у гігабітній мережі знижується на кілька відсотків.'''
risk = '''Старі NAS і БФП без підтримки підпису SMB2 не під'єднаються. Послаблювати разом із правилами SMB1 і NTLMv2 після інвентаризації.'''
versions = '''Windows 11 24H2 і Server 2025 вимагають підпис за замовчуванням у Pro та Enterprise; правило робить це явно й для Windows 10 та 11 до 23H2.'''
verify = '''Get-SmbServerConfiguration | Select-Object RequireSecuritySignature; Get-SmbClientConfiguration | Select-Object RequireSecuritySignature'''
rollback = '''Set-SmbServerConfiguration -RequireSecuritySignature $false; Set-SmbClientConfiguration -RequireSecuritySignature $false'''

["network.llmnr-off"]
title = '''LLMNR вимкнено (захист від підміни імен у мережі)'''
summary = '''Широкомовне опитування імен LLMNR вимкнено; інструменти класу Responder не отримують хеші від цих ПК.'''
effect = '''Імена комп'ютерів робочої групи й надалі розпізнаються через NetBIOS (залишено ввімкненим) і mDNS.'''
versions = '''Політика з Windows Vista; у 24H2 Microsoft оголосила LLMNR застарілим на користь mDNS.'''
verify = '''Get-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient' -Name EnableMulticast'''
rollback = '''Видалити значення.'''

["network.netbios-off"]
title = '''NetBIOS over TCP/IP вимкнено'''
summary = '''Закриває другий канал підміни імен (NBT-NS) і порти 137-139 на всіх поточних інтерфейсах.'''
effect = '''Без домену й WINS ім'я вигляду \\PC-NAME розпізнається лише через mDNS (pc-name.local) або DNS маршрутизатора; звичні ярлики спільних папок можуть перестати працювати.'''
risk = '''Інтерфейси, додані після встановлення (новий адаптер Wi-Fi, VPN), отримають типове значення. Вмикати лише після перевірки в конкретній мережі.'''
versions = '''Значення однакові з Windows 2000; у 24H2 NetBIOS за замовчуванням увімкнено.'''
verify = '''Get-CimInstance Win32_NetworkAdapterConfiguration | Select-Object Description, TcpipNetbiosOptions'''
rollback = '''NetbiosOptions = 0 для інтерфейсів, NodeType видалити.'''

["network.firewall"]
title = '''Брандмауер увімкнено на всіх профілях, вхідні блокуються, журнал відкинутих пакетів'''
summary = '''Політика для доменного, приватного й загальнодоступного профілів: брандмауер увімкнено і його не можна вимкнути з Панелі керування, вхідні за замовчуванням блокуються, вихідні дозволено, відкинуті пакети записуються у файл 16 МБ.'''
effect = '''Дозвільні правила (спільний доступ до файлів і принтерів, Delivery Optimization, mDNS) і далі працюють; під час розслідування видно, хто стукав на які порти.'''
risk = '''Профіль мережі (приватна/загальнодоступна) файл не задає; спільний доступ до папок потребує приватного профілю.'''
versions = '''Політика однакова з Windows Vista.'''
verify = '''Get-NetFirewallProfile | Select-Object Name, Enabled, DefaultInboundAction, LogBlocked'''
rollback = '''Видалити ключі профілів у HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall.'''

["removable.autorun-off"]
title = '''Автозапуск і автовідтворення вимкнено для всіх носіїв'''
summary = '''Автозапуск вимкнено для всіх типів дисків, файли autorun.inf ігноруються навіть на CD, автовідтворення вимкнено для пристроїв без літери диска (телефони, камери).'''
effect = '''Під'єднання флешки, диска чи телефона нічого не запускає і нічого не питає. Ручний запуск файлу охоплює правило ASR для USB.'''
versions = '''З Windows 7 autorun.inf на USB завжди ігнорується; для CD ще працює, тому NoAutorun потрібен.'''
verify = '''Get-ItemProperty HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'''
rollback = '''Видалити три значення.'''

["scripts.open-in-notepad"]
title = '''Файли скриптів (.js .vbs .hta та інші) відкриваються в Блокноті'''
summary = '''Подвійне клацання на .js, .jse, .vbs, .vbe, .wsf, .wsh, .hta показує текст у Блокноті, а не виконує його.'''
effect = '''Класичний фішинг «архів зі скриптом усередині» (рахунок.pdf.js) не спрацьовує. cscript, wscript і mshta з командного рядка та з програм працюють.'''
risk = '''Інсталятори, які запускають .vbs через оболонку (рідко), відкриють Блокнот. Асоціація в профілі користувача (Відкрити за допомогою) має пріоритет над цією.'''
versions = '''ProgId однакові з Windows XP.'''
verify = '''(Get-ItemProperty 'HKLM:\SOFTWARE\Classes\VBSFile\Shell\Open\Command').'(default)' '''
