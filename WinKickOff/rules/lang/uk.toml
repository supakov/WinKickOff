summary = '''Замінює список мов введення користувача списком із вузла «Мови та регіон» (за замовчуванням en-US, uk-UA, ru-UA). Мови без числового коду, як-от «Російська (Україна)», неможливо задати в XML, тому вони застосовуються тут; якщо Windows не призначила їм розкладку, застосовується резервний список, де їх замінено базовою мовою.'''
effect = '''У перемикачі мов користувача той самий порядок, що й у профілі; екран входу зберігає список із XML (з базовою мовою замість «Російська (Україна)»).'''
versions = '''ru-UA як мова введення підтримується у Windows 10 1803+ і 11; на збірці 26200 отримує тимчасовий код 2000:00000419. Windows може скорочувати теги (uk-UA відображається як uk).'''
verify = '''Get-WinUserLanguageList | Select-Object LanguageTag, InputMethodTips'''
rollback = '''Параметри -> Мова та регіон, або Set-WinUserLanguageList.'''

