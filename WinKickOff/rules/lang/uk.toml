effect = '''Шкідливі завантажувачі на PowerShell залишають повний текст у журналі навіть після видалення файлу.'''
risk = '''Секрети, передані адміністратором у командному рядку, потрапляють до журналу; доступ до журналу мають лише адміністратори.'''
versions = '''Script Block Logging з Windows 10 / WMF 5.0; діє і для PowerShell 7.'''
