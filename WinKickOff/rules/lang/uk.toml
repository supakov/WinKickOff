# Ukrainian texts of the rule catalog (rules/NN-*.toml). Table key: the rule id; _groups: group titles and summaries.
# Fields: title, summary, effect, risk, versions, verify, rollback, tags; params.<name>; values.<name>."<value>".
# A missing text falls back to the English source; tests/test_docs.py checks that these files are complete.
_language = "Українська"

["install.bypass-tpm"]
title = '''Обхід перевірки TPM 2.0'''
summary = '''Програма встановлення не вимагає TPM 2.0. На ПК з TPM модуль залишається ввімкненим і використовується.'''
effect = '''Встановлення відбувається на ПК без TPM або з TPM 1.2 без повідомлення про несумісність.'''
risk = '''Без TPM недоступні автоматичне шифрування пристрою та BitLocker без пароля під час завантаження. Microsoft не гарантує оновлень для непідтримуваних ПК.'''
versions = '''Ключі LabConfig діють лише в програмі встановлення Windows 11 (21H2 і новіших); Windows 10 їх ігнорує.'''
rollback = '''Видалити правило; на встановлену систему не впливає.'''

["install.bypass-secureboot"]
title = '''Обхід перевірки Secure Boot'''
summary = '''Програма встановлення не вимагає ввімкненого Secure Boot.'''
effect = '''Встановлення відбувається на ПК з BIOS/CSM або з вимкненим Secure Boot.'''
risk = '''Без Secure Boot не працюють Credential Guard і частина засобів захисту ядра; захист LSA в цьому файлі вибрано без прив'язки до UEFI саме заради таких ПК.'''
versions = '''Лише програма встановлення Windows 11.'''

["install.bypass-cpu"]
title = '''Обхід перевірки процесора'''
summary = '''Програма встановлення не звіряє процесор зі списком підтримуваних.'''
effect = '''Встановлення відбувається на процесорах, старіших за 8-ме покоління Intel і Ryzen 2000.'''
risk = '''У 24H2 вимогу інструкцій POPCNT і SSE4.2 обійти не можна: на дуже старих процесорах встановлення неможливе.'''
versions = '''Лише програма встановлення Windows 11.'''

["install.bypass-ram"]
title = '''Обхід перевірки обсягу пам'яті'''
summary = '''Програма встановлення не вимагає 4 ГБ пам'яті.'''
effect = '''Встановлення відбувається на ПК з меншим обсягом пам'яті; система працюватиме повільно.'''
versions = '''Лише програма встановлення Windows 11.'''

["install.bypass-storage"]
title = '''Обхід перевірки розміру диска'''
summary = '''Програма встановлення не вимагає 64 ГБ на диску.'''
effect = '''Встановлення можливе на малі диски; місце для оновлень треба контролювати.'''
versions = '''Лише програма встановлення Windows 11.'''

["install.bypass-nro"]
title = '''Дозволити завершення OOBE без інтернету та облікового запису Microsoft'''
summary = '''Ключ BypassNRO: початкове налаштування не вимагає підключення до мережі й облікового запису Microsoft.'''
effect = '''Страховка: облікові записи створюються з файлу, але якщо поведінка OOBE зміниться, ключ не дасть встановленню застрягти на екрані мережі.'''
versions = '''Windows 11 21H2 і новіші. Microsoft оголосила про видалення обхідних шляхів у збірках Insider 2025 року; у випущених 24H2 і 25H2 ключ діє.'''
verify = '''reg query HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\OOBE /v BypassNRO'''
rollback = '''Видалити значення; на встановлену систему не впливає.'''

["install.netfx3"]
title = '''.NET Framework 3.5 з інсталяційного носія'''
summary = '''Шукає папку sources\sxs на підключених дисках і вмикає .NET Framework 3.5 (включно з 2.0 і 3.0) без інтернету.'''
effect = '''Старі програми обліку й банківські програми, а також драйвери ключів ЕЦП працюють одразу після встановлення.'''
risk = '''Носій має залишатися підключеним під час першого перезавантаження; інакше компонент не встановиться, а в журнал потрапить WARN. Пізніше його можна додати через Параметри за наявності інтернету.'''
versions = '''Папка sources\sxs є в усіх офіційних ISO Windows 10 і 11; в урізаних образах її може не бути.'''
verify = '''Get-WindowsOptionalFeature -Online -FeatureName NetFx3'''
rollback = '''Disable-WindowsOptionalFeature -Online -FeatureName NetFx3'''

["oobe.hide-eula"]
title = '''Приховати екран ліцензійної угоди'''
summary = '''Ліцензію прийнято в програмі встановлення (AcceptEula), екран в OOBE не показується.'''
effect = '''На один екран менше; відповідальність за прийняття умов несе організація.'''

["oobe.hide-oem-registration"]
title = '''Приховати екран реєстрації у виробника'''
summary = '''Екран реєстрації OEM не показується (з'являється лише в образах виробників).'''
effect = '''Нешкідливо для образів Microsoft; заощаджує один екран на OEM-образах.'''

["oobe.hide-online-account"]
title = '''Приховати екрани облікового запису Microsoft'''
summary = '''Екрани входу в обліковий запис Microsoft і створення локального облікового запису не показуються: облікові записи задано у файлі.'''
effect = '''Після підготовки система одразу показує екран входу зі стартовими обліковими записами.'''
risk = '''Працює лише разом з обліковими записами в розділі «Облікові записи»; без них OOBE вимагатиме створити обліковий запис.'''

["oobe.hide-wireless"]
title = '''Приховати екран підключення до мережі'''
summary = '''Екран «Підключіться до мережі» приховано завжди, а не лише за наявності дротового підключення.'''
effect = '''Встановлення не зупиняється на ноутбуках без кабелю; Wi-Fi налаштовується після входу.'''

["oobe.protect-your-pc"]
title = '''Екран параметрів конфіденційності: вимкнути експрес-параметри'''
summary = '''Екран конфіденційності не показується; надсилання даних, реклама та визначення розташування за замовчуванням вимкнені.'''
effect = '''SmartScreen і Defender не зачіпаються: їх вмикають окремі правила.'''
versions = '''Значення 3 працює у Windows 10 і 11, включно з 24H2.'''
params.mode = '''Режим'''
values.mode."3" = '''Вимкнути всі експрес-параметри'''
values.mode."1" = '''Увімкнути експрес-параметри (надсилання даних)'''

["printing.spooler-automatic"]
title = '''Диспетчер друку запускається автоматично'''
summary = '''Службу Spooler переведено на автоматичний запуск (реєстр і Set-Service), PrintNotify залишається з ручним запуском.'''
effect = '''Друк працює одразу після встановлення: принтери USB і мережеві, «Друк у PDF». Служба запускається разом із Windows, навіть якщо раніше її було переведено в ручний режим.'''
risk = '''Диспетчер друку історично є джерелом вразливостей (PrintNightmare); ризик компенсують правило встановлення драйверів лише адміністраторами та брандмауер.'''
versions = '''Без змін у всіх версіях. У 24H2 є режим захищеного друку (WPP), він не вмикається: старі принтери потребують власних драйверів.'''
verify = '''Get-Service Spooler | Select-Object Status, StartType'''
rollback = '''Set-Service Spooler -StartupType Manual'''

["printing.point-and-print-admins"]
title = '''Драйвери принтерів встановлюють лише адміністратори'''
summary = '''Політика Point and Print: встановлення й оновлення драйверів принтерів вимагає прав адміністратора та супроводжується попередженням.'''
effect = '''Стандартний користувач не встановить драйвер принтера; уже встановлені драйвери та драйвери класу доступні всім.'''
risk = '''Підключення мережевого принтера з новим драйвером виконує адміністратор. Поки в Admin порожній пароль, запит облікових даних у користувача не спрацює.'''
versions = '''Значення Windows за замовчуванням із серпня 2021 року (KB5005652); правило закріплює його політикою.'''
verify = '''Get-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\PointAndPrint' '''
rollback = '''RestrictDriverInstallationToAdministrators = 0 (повертає вектор PrintNightmare).'''

["update.unblock"]
title = '''Зняти будь-які блокування Центру оновлення'''
summary = '''Видаляє політики, які вимикають оновлення, драйвери чи автооновлення Store, і повертає вимкнені служби оновлення в ручний режим.'''
effect = '''На чистому образі нічого не змінює; захищає від слідів сторонніх «оптимізаторів» і робить повторний запуск скрипта безпечним.'''
versions = '''Без змін.'''
verify = '''Get-ItemProperty HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'''

["update.automatic"]
title = '''Автоматичне встановлення оновлень і період активності'''
summary = '''Оновлення завантажуються та встановлюються самі; автоматичне перезавантаження в період активності заборонено.'''
effect = '''Перезавантаження вночі або до початку робочого дня; користувач бачить сповіщення і може відкласти його в межах політики.'''
risk = '''Період активності не довший за 18 годин. ПК, що працюють цілодобово, перезавантажаться поза цим періодом.'''
versions = '''Працює у Windows 10 і 11; у 24H2 фіксовані години замінюють автоматичне визначення періоду.'''
verify = '''Get-ItemProperty HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'''
rollback = '''Видалити SetActiveHours, ActiveHoursStart, ActiveHoursEnd.'''
params.start = '''Початок періоду активності (година)'''
params.end = '''Кінець періоду активності (година)'''

["update.other-microsoft-products"]
title = '''Оновлення інших продуктів Microsoft (Office, .NET)'''
summary = '''Підключення до Microsoft Update: виправлення Office (MSI), .NET та інших продуктів надходять разом з оновленнями Windows.'''
effect = '''Перемикач у Параметрах увімкнений і заблокований. Office 365 (Click-to-Run) оновлюється власним механізмом незалежно.'''
versions = '''Без змін.'''
verify = '''(New-Object -ComObject Microsoft.Update.ServiceManager).Services | Where-Object IsDefaultAUService'''

["update.defer-feature"]
title = '''Відкладення оновлень функцій'''
summary = '''Щорічні оновлення версії надходять із затримкою; щомісячні оновлення безпеки не відкладаються.'''
effect = '''За час відкладення Microsoft виправляє помилки перших тижнів, а для програм обліку виходять сумісні версії.'''
risk = '''Потребує працездатної оцінки сумісності: правило мінімальної телеметрії навмисно залишає DiagTrack у ручному режимі, а не вимикає.'''
versions = '''Windows 10 1703+ і Windows 11 Pro/Enterprise; у Home відкладення немає. Діапазон 0-365 днів.'''
verify = '''Get-ItemProperty HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate | Select-Object DeferFeatureUpdatesPeriodInDays'''
rollback = '''Видалити DeferFeatureUpdates і DeferFeatureUpdatesPeriodInDays.'''
params.days = '''Днів відкладення'''

["update.delivery-optimization-lan"]
title = '''Delivery Optimization: обмін оновленнями лише в локальній мережі'''
summary = '''ПК однієї мережі обмінюються завантаженими фрагментами оновлень між собою; назовні нічого не віддається.'''
effect = '''В офісі з десятком ПК оновлення завантажується з інтернету один раз. Потрібен відкритий порт 7680 між ПК (правило брандмауера Windows створює самостійно).'''
versions = '''Режими 0 (лише HTTP), 1 (локальна мережа), 3 (інтернет), 99 (простий режим) однакові починаючи з Windows 10 1607.'''
verify = '''Get-DOConfig'''
params.mode = '''Режим'''
values.mode."1" = '''Лише локальна мережа'''
values.mode."0" = '''Лише HTTP, без обміну'''
values.mode."99" = '''Простий режим без хмари'''

["defender.realtime"]
title = '''Захист у реальному часі ввімкнено й закріплено'''
summary = '''Видаляє значення, якими сторонні скрипти вимикають Defender, і закріплює захист у реальному часі, аналіз поведінки, перевірку завантажень і скриптів.'''
effect = '''Антивірус не можна вимкнути через реєстр; перемикачами в Безпеці Windows керує політика.'''
versions = '''Без змін; захист від підробки (Tamper Protection) додатково не дає послабити захист.'''
verify = '''Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, BehaviorMonitorEnabled'''

["defender.cloud"]
title = '''Хмарний захист: MAPS, надсилання зразків, рівень блокування'''
summary = '''Участь у MAPS рівня «Розширений», автоматичне надсилання безпечних зразків, рівень хмарного блокування «Високий», очікування вердикту до 50 секунд.'''
effect = '''Нові шкідливі файли без сигнатур блокуються за лічені секунди на підставі хмарної репутації; підозрілий файл затримується до хвилини перед першим запуском.'''
risk = '''Рівень «Високий» підвищує частку хибних спрацювань на рідкісних програмах власної розробки; рішення: виняток для файлу або рівень 0. Потребує інтернету.'''
versions = '''Windows 10 1607 (рівень блокування) і 1703 (тайм-аут); 24H2 без змін.'''
verify = '''Get-MpPreference | Select-Object MAPSReporting, SubmitSamplesConsent, CloudBlockLevel, CloudExtendedTimeout'''
rollback = '''Видалити чотири значення; Defender повернеться до значень за замовчуванням.'''
params.block_level = '''Рівень хмарного блокування'''
values.block_level."2" = '''Високий'''
values.block_level."0" = '''За замовчуванням'''
values.block_level."4" = '''Високий плюс (більше хибних спрацювань)'''
values.block_level."6" = '''Нульова толерантність (блокує все невідоме)'''
params.timeout = '''Додаткове очікування вердикту хмари, секунд'''

["defender.pua"]
title = '''Блокувати потенційно небажані програми (PUA)'''
summary = '''Defender блокує adware, інсталятори-бандли, майнери та «оптимізатори» під час завантаження і запуску.'''
effect = '''Закриває найчастіший канал зараження непрофесіоналів: «безкоштовна програма із сайту з кнопкою Завантажити».'''
risk = '''Легітимні утиліти, позначені як PUA (деякі засоби віддаленого доступу), потребують винятку.'''
versions = '''Політика з Windows 10 1607; перемикач у Параметрах з 2004.'''
verify = '''Get-MpPreference | Select-Object PUAProtection'''
rollback = '''Видалити значення PUAProtection.'''

["defender.network-protection"]
title = '''Захист мережі: блокувати підключення до небезпечних адрес'''
summary = '''Будь-яка програма, не лише Edge, не може підключитися до доменів із поганою репутацією за даними SmartScreen.'''
effect = '''Фішингові сайти й командні сервери блокуються зі сповіщенням «Підключення заблоковано».'''
risk = '''Працює лише тоді, коли Defender є основним антивірусом; може конфліктувати з VPN-клієнтами, що мають власні фільтри (тоді режим аудиту).'''
versions = '''Windows 10 1709+.'''
verify = '''Get-MpPreference | Select-Object EnableNetworkProtection'''
params.mode = '''Режим'''
values.mode."1" = '''Блокувати'''
values.mode."2" = '''Аудит (лише журнал)'''

["defender.asr"]
title = '''Механізм правил зменшення поверхні атаки (ASR) увімкнено'''
summary = '''Вмикає механізм ASR; самі правила перелічено в підгрупі, їх налаштовують по одному.'''
effect = '''Без цього правила жодне правило ASR не діє.'''
versions = '''Доступно в усіх випусках із Defender (включно з Home), керується лише політиками або PowerShell.'''
verify = '''Get-MpPreference | Select-Object AttackSurfaceReductionRules_Ids'''

