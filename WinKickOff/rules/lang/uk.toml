["asr.obfuscated-scripts"]
title = '''ASR: блокувати запуск обфускованих скриптів'''
summary = '''PowerShell, JS і VBS з ознаками обфускації не виконуються. Потребує хмарного захисту.'''
effect = '''Зупиняє завантажувачі, які ховають код від антивірусу.'''
