effect = '''Обидва записи ведуть до однієї й тієї самої папки профілю; Windows 10 показувала лише перший. Вмикати разом із правилом «Показувати «Документи» в «Цей комп'ютер»» не потрібно: папка може з'явитися двічі.'''
versions = '''Windows 11 22H2 і новіші; у 24H2 і 25H2 усі записи є й приховані значенням HiddenByDefault = 1. Записується в 64-бітну й 32-бітну (WOW6432Node) гілки, щоб діалоги 32-бітних програм збігалися з Провідником.'''
verify = '''reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\MyComputer\NameSpace\{A8CDFF1C-4878-43be-B5FD-F8091C1C60D0}" /v HiddenByDefault'''
rollback = '''Значення 1 в обох гілках (за замовчуванням у Windows 11 24H2 і 25H2).'''

