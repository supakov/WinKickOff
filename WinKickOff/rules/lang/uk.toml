rollback = '''Видалити розділ {0DB7E03F-FC29-4DC6-9020-FF41B59E513A} в обох гілках NameSpace (автоматичне повернення не видаляє розділи).'''

["nav.gallery-hidden"]
title = '''Приховати «Галерею» в області переходів Провідника'''
summary = '''Пункт «Галерея» (перегляд усіх фотографій) не показується на лівій панелі Провідника в усіх користувачів.'''
effect = '''Менше зайвих пунктів у Провіднику; самі фотографії та папка «Зображення» залишаються доступними.'''
versions = '''Windows 11 22H2 (22621.2361) і новіші.'''
verify = '''reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Desktop\NameSpace\{e88865ea-0e1c-4e20-9aa6-edcd0212c87c}" /v HiddenByDefault'''
rollback = '''Видалити значення HiddenByDefault в обох гілках.'''

["nav.home-hidden"]
title = '''Приховати «Головну» в області переходів Провідника'''
summary = '''Пункт «Головна» (нещодавні файли й закріплені папки) не показується на лівій панелі Провідника; Провідник відкривається на «Цей комп'ютер».'''
effect = '''Нещодавні файли не видно під час відкриття Провідника. Вимкнено за замовчуванням: разом із прихованими папками в «Цей комп'ютер» користувачі втрачають швидкий шлях до «Документів» і «Робочого столу»; вмикайте разом із правилами «Показувати ... в «Цей комп'ютер»».'''
risk = '''За повідомленнями користувачів, разом із «Головною» зникають закріплені папки швидкого доступу.'''
versions = '''Windows 11 22H2 і новіші.'''
verify = '''reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Desktop\NameSpace\{f874310e-b6b7-47dc-bc84-b9e6b38f5903}" /v HiddenByDefault'''
rollback = '''Видалити значення HiddenByDefault в обох гілках.'''

["nav.launch-to-this-pc"]
title = '''Відкривати Провідник на «Цей комп'ютер»'''
summary = '''Провідник (Win+E) відкривається на «Цей комп'ютер», а не на «Головній».'''
effect = '''Одразу видно диски й папки «Цей комп'ютер». Потрібне для правила «Приховати «Головну»», інакше Провіднику нікуди відкриватися.'''
versions = '''Windows 10 і 11.'''
verify = '''reg query "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" /v LaunchTo'''
rollback = '''Параметри папок, Відкрити Провідник для: «Головна».'''

