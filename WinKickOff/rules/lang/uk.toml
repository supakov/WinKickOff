["user-logon.input-languages"]
title = '''Список мов введення користувача з профілю (включно з «Російська (Україна)»)'''
summary = '''Замінює список мов введення користувача списком із вузла «Мови та регіон» (за замовчуванням en-US, uk-UA, ru-UA). Мови без числового коду, як-от «Російська (Україна)», неможливо задати в XML, тому вони застосовуються тут; якщо Windows не призначила їм розкладку, застосовується резервний список, де їх замінено базовою мовою.'''
effect = '''У перемикачі мов користувача той самий порядок, що й у профілі; екран входу зберігає список із XML (з базовою мовою замість «Російська (Україна)»).'''
versions = '''ru-UA як мова введення підтримується у Windows 10 1803+ і 11; на збірці 26200 отримує тимчасовий код 2000:00000419. Windows може скорочувати теги (uk-UA відображається як uk).'''
verify = '''Get-WinUserLanguageList | Select-Object LanguageTag, InputMethodTips'''
rollback = '''Параметри -> Мова та регіон, або Set-WinUserLanguageList.'''

["post-oobe.password-never-expires"]
title = '''Ознака «термін дії пароля не обмежений» для стартових облікових записів'''
summary = '''Для кожного облікового запису з профілю встановлюється PasswordNeverExpires. Дублює налаштування комп'ютера net accounts на випадок, якщо його змінять.'''
effect = '''Стартові облікові записи без пароля не отримають вимоги змінити пароль.'''
versions = '''Set-LocalUser з Windows 10 1607.'''
verify = '''Get-LocalUser -Name Admin, User | Select-Object Name, PasswordExpires: поле PasswordExpires порожнє.'''
rollback = '''Set-LocalUser -Name <ім'я> -PasswordNeverExpires $false від імені адміністратора; робити разом із призначенням паролів.'''

["post-oobe.disable-builtin-accounts"]
title = '''Вбудовані Адміністратор і Гість залишаються вимкненими'''
summary = '''Облікові записи з RID 500 і 501 визначаються за SID (імена локалізовано в українському образі) і вимикаються, якщо ввімкнені.'''
effect = '''Загальновідомі імена не можна використати для входу.'''
versions = '''Get-LocalUser з Windows 10 1607.'''
verify = '''Get-LocalUser | Where-Object { $_.SID.Value -match '-50[01]$' } | Select-Object Name, Enabled: в обох записів Enabled = False.'''
rollback = '''Enable-LocalUser -SID <SID> від імені адміністратора. Вмикати вбудованого Адміністратора не рекомендовано: його ім'я відоме всім.'''

["post-oobe.collect-specialize-errors"]
title = '''Перенести помилки проходу specialize до журналу'''
summary = '''Якщо обгортки команд specialize записали помилку (скрипт не видобуто або він аварійно завершився), її текст потрапляє до Post-OOBE.log з позначкою SPECIALIZE ERROR.'''
effect = '''Єдиний спосіб дізнатися, що скрипт комп'ютера не виконався.'''
verify = '''C:\ProgramData\Unattend\Logs\Post-OOBE.log: рядків SPECIALIZE ERROR немає; файлу C:\Windows\Temp\ua.err немає.'''
rollback = '''Не потрібно: правило лише переносить текст помилок до журналу й видаляє тимчасовий файл.'''

["post-oobe.delete-answer-file-copies"]
title = '''Видалити копії файлу відповідей із системи'''
