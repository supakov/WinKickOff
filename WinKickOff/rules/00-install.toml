[[rule]]
id = "install.bypass-nro"
group = "install"
phase = "specialize-xml"
title = "Разрешить завершение OOBE без интернета и учётной записи Microsoft"
level = "baseline"
default = true
tags = ["oobe", "bypassnro", "локальная учётная запись", "сеть"]
doc = "docs/technical/reference/02-specialize-xml.md"
summary = "Ключ BypassNRO: первичная настройка не требует подключения к сети и аккаунта Microsoft."
effect = "Страховка: учётные записи создаются из файла, но при изменении поведения OOBE ключ не даст установке застрять на экране сети."
versions = "Windows 11 21H2 и новее. Microsoft объявила об удалении обходов в сборках Insider 2025 года; на выпущенных 24H2 и 25H2 ключ действует."
verify = "reg query HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\OOBE /v BypassNRO"
rollback = "Удалить значение; на установленную систему не влияет."

[[rule.actions]]
type = "xml-specialize-command"
command = 'reg.exe add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\OOBE" /v BypassNRO /t REG_DWORD /d 1 /f'
description = "Allow OOBE to finish without a Microsoft account or network"

[[rule]]
id = "install.netfx3"
group = "install"
phase = "specialize"
title = ".NET Framework 3.5 с установочного носителя"
level = "optional"
default = true
tags = ["netfx3", ".net", "dism", "старые программы", "1с"]
doc = "docs/technical/reference/04-users-and-media.md"
summary = "Ищет папку sources\\sxs на подключённых дисках и включает .NET Framework 3.5 (включая 2.0 и 3.0) без интернета."
effect = "Старые программы учёта, клиент-банки и драйверы ключей ЭЦП работают сразу после установки."
risk = "Носитель должен оставаться подключённым во время первой перезагрузки; иначе компонент не установится и в лог попадёт WARN. Позже его можно добавить через Параметры при наличии интернета."
versions = "Папка sources\\sxs есть во всех официальных ISO Windows 10 и 11; в урезанных образах может отсутствовать."
verify = "Get-WindowsOptionalFeature -Online -FeatureName NetFx3"
rollback = "Disable-WindowsOptionalFeature -Online -FeatureName NetFx3"

[[rule.actions]]
type = "ps"
script = '''
$src = $null
foreach ($d in [System.IO.DriveInfo]::GetDrives()) {
    try {
        if (-not $d.IsReady) { continue }
        $p = Join-Path $d.RootDirectory.FullName 'sources\sxs'
        if ((Test-Path $p) -and (Get-ChildItem -Path $p -Filter '*.cab' -ErrorAction SilentlyContinue)) { $src = $p; break }
    } catch { }
}
if ($src) { Invoke-Exe 'dism.exe' @('/Online','/Enable-Feature','/FeatureName:NetFx3','/All','/LimitAccess',"/Source:$src",'/NoRestart','/Quiet') }
else { Write-Log 'sources\sxs not found on any drive, .NET 3.5 skipped (can be added later from Windows Update)' 'WARN' }
'''
