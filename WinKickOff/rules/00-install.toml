# Проход windowsPE и команды specialize, которые выполняются до скрипта машины.

[[rule]]
id = "install.bypass-tpm"
group = "install"
phase = "windowspe"
title = "Обход проверки TPM 2.0"
level = "optional"
default = true
tags = ["tpm", "labconfig", "старое железо", "совместимость"]
doc = "docs/technical/reference/01-windows-pe.md"
summary = "Установщик не требует TPM 2.0. На ПК с TPM модуль остаётся включённым и используется."
effect = "Установка проходит на ПК без TPM или с TPM 1.2 без сообщения о несовместимости."
risk = "Без TPM недоступны автоматическое шифрование устройства и BitLocker без пароля при загрузке. Microsoft не гарантирует обновления неподдерживаемым ПК."
versions = "Ключи LabConfig действуют только в установщике Windows 11 (21H2 и новее); Windows 10 их игнорирует."
rollback = "Удалить правило; на установленную систему не влияет."

[[rule.actions]]
type = "xml-pe-command"
command = 'reg.exe add "HKLM\SYSTEM\Setup\LabConfig" /v BypassTPMCheck /t REG_DWORD /d 1 /f'
description = "Bypass TPM check"

[[rule]]
id = "install.bypass-secureboot"
group = "install"
phase = "windowspe"
title = "Обход проверки Secure Boot"
level = "optional"
default = true
tags = ["secure boot", "uefi", "labconfig", "старое железо"]
doc = "docs/technical/reference/01-windows-pe.md"
summary = "Установщик не требует включённой Secure Boot."
effect = "Установка проходит на ПК с BIOS/CSM или с выключенной Secure Boot."
risk = "Без Secure Boot не работают Credential Guard и часть защит ядра; защита LSA в этом файле выбрана без привязки к UEFI именно ради таких ПК."
versions = "Только установщик Windows 11."

[[rule.actions]]
type = "xml-pe-command"
command = 'reg.exe add "HKLM\SYSTEM\Setup\LabConfig" /v BypassSecureBootCheck /t REG_DWORD /d 1 /f'
description = "Bypass Secure Boot check"

