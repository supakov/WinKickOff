# Logging for incident investigation. Section 7 of the v0.2 machine script.

[[rule]]
id = "logging.eventlog-sizes"
group = "logging"
phase = "specialize"
title = "Larger event logs (Security 256 MB, System and Application 64 MB, PowerShell 128 MB)"
level = "recommended"
default = true
tags = ["event log", "wevtutil", "security", "size"]
doc = "docs/technical/reference/11-logging-audit.md#auditlogging"
summary = "Log sizes are raised from 20 MB (15 MB for PowerShell) so that several weeks of history are not overwritten."
effect = "Without this rule, auditing and PowerShell logging become useless within a few days."
versions = "No changes."
verify = "wevtutil gl Security | findstr maxSize"
rollback = "wevtutil sl Security /ms:20971520"

[[rule.actions]]
type = "exe"
file = "wevtutil.exe"
args = ["sl", "Security", "/ms:268435456"]

[[rule.actions]]
type = "exe"
file = "wevtutil.exe"
args = ["sl", "System", "/ms:67108864"]

[[rule.actions]]
type = "exe"
file = "wevtutil.exe"
args = ["sl", "Application", "/ms:67108864"]

[[rule.actions]]
type = "exe"
file = "wevtutil.exe"
args = ["sl", "Microsoft-Windows-PowerShell/Operational", "/ms:134217728"]

[[rule]]
id = "logging.audit-policy"
group = "logging"
phase = "specialize"
title = "Auditing: process creation with command line, logons, lockouts, accounts, removable storage"
level = "recommended"
default = true
requires = ["logging.eventlog-sizes"]
tags = ["audit", "auditpol", "4688", "4624", "command line", "removable media"]
doc = "docs/technical/reference/11-logging-audit.md#auditlogging"
summary = "Event 4688 includes the full command line; the subcategories for logon, account lockout, user account and group management, credential validation, scheduled tasks and removable storage are enabled. Subcategories are specified by GUID: on the Ukrainian image auditpol does not accept English names."
effect = "In an incident, the Security log lets you reconstruct the chain: which process, with which arguments, under which user."
risk = "Removable storage auditing writes many events when large folders are copied to a USB flash drive."
versions = "The \"Removable Storage\" subcategory since Windows 8; the command line in 4688 since Windows 8.1; the GUIDs are the same in all versions."
verify = "auditpol /get /category:*"
rollback = "auditpol /clear"

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Audit'
name = "ProcessCreationIncludeCmdLine_Enabled"
kind = "DWord"
value = 1
why = "command line in event 4688"
default = "absent"

[[rule.actions]]
type = "exe"
file = "auditpol.exe"
args = ["/set", "/subcategory:{0CCE922B-69AE-11D9-BED3-505054503030}", "/success:enable", "/failure:enable"]

[[rule.actions]]
type = "exe"
file = "auditpol.exe"
args = ["/set", "/subcategory:{0CCE9215-69AE-11D9-BED3-505054503030}", "/success:enable", "/failure:enable"]

[[rule.actions]]
type = "exe"
file = "auditpol.exe"
