[[rule]]
id = "logging.powershell"
group = "logging"
phase = "specialize"
title = "Журналирование PowerShell: блоки кода и вызовы командлетов"
level = "recommended"
default = true
requires = ["logging.eventlog-sizes"]
tags = ["powershell", "script block logging", "4104", "module logging"]
doc = "docs/technical/reference/11-logging-audit.md#powershelllogging"
summary = "Текст каждого выполняемого блока кода (событие 4104, включая деобфусцированный код) и вызовы командлетов всех модулей (4103) пишутся в журнал PowerShell."
effect = "Вредоносные загрузчики на PowerShell оставляют полный текст в журнале даже после удаления файла."
risk = "Секреты, переданные администратором в командной строке, попадают в журнал; доступ к журналу только у администраторов."
versions = "Script Block Logging с Windows 10 / WMF 5.0; действует и на PowerShell 7."
verify = "Get-ItemProperty HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\PowerShell\\ScriptBlockLogging"
rollback = "Удалить два ключа."

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging'
name = "EnableScriptBlockLogging"
kind = "DWord"
value = 1

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ModuleLogging'
name = "EnableModuleLogging"
kind = "DWord"
value = 1

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ModuleLogging\ModuleNames'
name = "*"
kind = "String"
value = "*"

[[rule]]
id = "logging.powershell-v2-off"
group = "logging"
phase = "specialize"
title = "PowerShell 2.0 отключён"
level = "recommended"
default = true
tags = ["powershell 2.0", "downgrade", "amsi", "компонент"]
doc = "docs/technical/reference/11-logging-audit.md#disablepowershellv2"
summary = "Старый движок, не поддерживающий журналирование и проверку антивирусом (AMSI), отключается как компонент Windows."
effect = "Команда powershell -Version 2 не работает; атаки понижения версии невозможны."
versions = "Компонент есть в Windows 10 и Windows 11 до 23H2; в 24H2 (с августа 2025) и 25H2 движок удалён из образа, команда запишет INFO об отсутствии."
verify = "Get-WindowsOptionalFeature -Online -FeatureName MicrosoftWindowsPowerShellV2Root"
rollback = "Enable-WindowsOptionalFeature -Online -FeatureName MicrosoftWindowsPowerShellV2Root"

[[rule.actions]]
type = "feature"
name = "MicrosoftWindowsPowerShellV2Root"
state = "Disabled"

[[rule.actions]]
type = "feature"
name = "MicrosoftWindowsPowerShellV2"
state = "Disabled"
