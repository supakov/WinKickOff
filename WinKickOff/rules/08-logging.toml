# Журналирование для расследования инцидентов. Раздел 7 скрипта машины v0.2.

[[rule]]
id = "logging.eventlog-sizes"
group = "logging"
phase = "specialize"
title = "Увеличенные журналы событий (Security 256 МБ, System и Application 64 МБ, PowerShell 128 МБ)"
level = "recommended"
default = true
tags = ["журнал событий", "wevtutil", "security", "размер"]
doc = "docs/technical/reference/11-logging-audit.md#auditlogging"
summary = "Размеры журналов подняты с 20 МБ (15 МБ у PowerShell), чтобы история за несколько недель не затиралась."
effect = "Аудит и журналирование PowerShell без этого правила бесполезны через несколько дней."
versions = "Без изменений."
verify = "wevtutil gl Security | findstr maxSize"
rollback = "wevtutil sl Security /ms:20971520"

[[rule.actions]]
type = "exe"
file = "wevtutil.exe"
args = ["sl", "Security", "/ms:268435456"]

[[rule.actions]]
type = "exe"
file = "wevtutil.exe"
args = ["sl", "System", "/ms:67108864"]

[[rule.actions]]
type = "exe"
file = "wevtutil.exe"
args = ["sl", "Application", "/ms:67108864"]

[[rule.actions]]
type = "exe"
file = "wevtutil.exe"
args = ["sl", "Microsoft-Windows-PowerShell/Operational", "/ms:134217728"]

[[rule]]
id = "logging.audit-policy"
group = "logging"
phase = "specialize"
title = "Аудит: создание процессов с командной строкой, входы, блокировки, учётные записи, съёмные носители"
level = "recommended"
default = true
requires = ["logging.eventlog-sizes"]
tags = ["аудит", "auditpol", "4688", "4624", "командная строка", "съёмные носители"]
doc = "docs/technical/reference/11-logging-audit.md#auditlogging"
summary = "Событие 4688 включает полную командную строку; включены подкатегории входа, блокировок, управления учётными записями и группами, проверки учётных данных, задач планировщика и съёмных носителей. Подкатегории заданы по GUID: на украинском образе auditpol не принимает английские имена."
effect = "При инциденте по журналу Security восстанавливается цепочка: какой процесс, с какими аргументами, под каким пользователем."
risk = "Аудит съёмных носителей пишет много событий при копировании больших папок на флешку."
versions = "Подкатегория «Съёмное хранилище» с Windows 8; командная строка в 4688 с Windows 8.1; GUID одинаковы во всех версиях."
verify = "auditpol /get /category:*"
rollback = "auditpol /clear"

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Audit'
name = "ProcessCreationIncludeCmdLine_Enabled"
kind = "DWord"
value = 1
why = "command line in event 4688"

[[rule.actions]]
type = "exe"
file = "auditpol.exe"
args = ["/set", "/subcategory:{0CCE922B-69AE-11D9-BED3-505054503030}", "/success:enable", "/failure:enable"]

[[rule.actions]]
type = "exe"
file = "auditpol.exe"
args = ["/set", "/subcategory:{0CCE9215-69AE-11D9-BED3-505054503030}", "/success:enable", "/failure:enable"]

[[rule.actions]]
type = "exe"
file = "auditpol.exe"
args = ["/set", "/subcategory:{0CCE9216-69AE-11D9-BED3-505054503030}", "/success:enable", "/failure:enable"]

[[rule.actions]]
