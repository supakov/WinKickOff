[[rule]]
id = "logging.powershell"
group = "logging"
phase = "specialize"
title = "PowerShell logging: script blocks and cmdlet invocations"
level = "recommended"
default = true
requires = ["logging.eventlog-sizes"]
tags = ["powershell", "script block logging", "4104", "module logging"]
doc = "docs/technical/reference/11-logging-audit.md#powershelllogging"
summary = "The text of every executed script block (event 4104, including deobfuscated code) and the cmdlet invocations of all modules (4103) are written to the PowerShell log."
effect = "Malicious PowerShell loaders leave their full text in the log even after the file is deleted."
risk = "Secrets that an administrator passes on the command line end up in the log; only administrators have access to the log."
versions = "Script Block Logging since Windows 10 / WMF 5.0; also applies to PowerShell 7."
verify = "Get-ItemProperty HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\PowerShell\\ScriptBlockLogging"
rollback = "Delete the two keys."

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging'
name = "EnableScriptBlockLogging"
kind = "DWord"
value = 1

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ModuleLogging'
name = "EnableModuleLogging"
kind = "DWord"
value = 1

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ModuleLogging\ModuleNames'
name = "*"
kind = "String"
value = "*"

[[rule]]
id = "logging.powershell-v2-off"
group = "logging"
phase = "specialize"
title = "PowerShell 2.0 disabled"
level = "recommended"
default = true
tags = ["powershell 2.0", "downgrade", "amsi", "windows feature"]
doc = "docs/technical/reference/11-logging-audit.md#disablepowershellv2"
summary = "The old engine, which supports neither logging nor antivirus scanning (AMSI), is disabled as a Windows feature."
effect = "The powershell -Version 2 command does not work; downgrade attacks are impossible."
versions = "The feature exists in Windows 10 and Windows 11 up to 23H2; in 24H2 (since August 2025) and 25H2 the engine is removed from the image, and the command logs an INFO message that it is missing."
verify = "Get-WindowsOptionalFeature -Online -FeatureName MicrosoftWindowsPowerShellV2Root"
rollback = "Enable-WindowsOptionalFeature -Online -FeatureName MicrosoftWindowsPowerShellV2Root"

[[rule.actions]]
type = "feature"
name = "MicrosoftWindowsPowerShellV2Root"
state = "Disabled"
default = "Enabled"

[[rule.actions]]
type = "feature"
name = "MicrosoftWindowsPowerShellV2"
state = "Disabled"
default = "Enabled"
