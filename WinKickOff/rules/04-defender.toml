# Microsoft Defender, правила ASR, SmartScreen. Раздел 3 скрипта машины v0.2.
# Все настройки записываются как политики (HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender):
# Defender читает их без запущенной службы, а соответствующие переключатели в интерфейсе становятся серыми.

[[rule]]
id = "defender.realtime"
group = "defender"
phase = "specialize"
title = "Защита в реальном времени включена и закреплена"
level = "baseline"
default = true
tags = ["defender", "антивирус", "реальное время", "amsi", "поведенческий анализ"]
doc = "docs/technical/reference/07-defender.md"
summary = "Удаляет значения, которыми сторонние скрипты отключают Defender, и закрепляет защиту в реальном времени, поведенческий анализ, проверку загрузок и скриптов."
effect = "Антивирус нельзя выключить через реестр; переключатели в Безопасности Windows управляются политикой."
versions = "Без изменений; защита от подделки (Tamper Protection) дополнительно не даёт ослабить защиту."
verify = "Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, BehaviorMonitorEnabled"

[[rule.actions]]
type = "reg-remove"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
name = "DisableAntiSpyware"

[[rule.actions]]
type = "reg-remove"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
name = "DisableAntiVirus"

[[rule.actions]]
type = "reg-remove"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
name = "DisableRealtimeMonitoring"

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
name = "DisableRealtimeMonitoring"
kind = "DWord"
value = 0

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
name = "DisableBehaviorMonitoring"
kind = "DWord"
value = 0

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
name = "DisableIOAVProtection"
kind = "DWord"
value = 0

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
name = "DisableScriptScanning"
kind = "DWord"
value = 0

[[rule]]
id = "defender.cloud"
group = "defender"
phase = "specialize"
title = "Облачная защита: MAPS, отправка образцов, уровень блокировки"
level = "recommended"
default = true
requires = ["defender.realtime"]
tags = ["defender", "облако", "maps", "spynet", "cloud block level", "образцы"]
doc = "docs/technical/reference/07-defender.md#defendercloudprotection"
summary = "Участие в MAPS уровня «Расширенный», автоматическая отправка безопасных образцов, уровень облачной блокировки «Высокий», ожидание вердикта до 50 секунд."
effect = "Новые вредоносные файлы без сигнатур блокируются по облачной репутации за секунды; подозрительный файл задерживается до минуты перед первым запуском."
risk = "Уровень «Высокий» повышает долю ложных срабатываний на редких самописных программах; решение: исключение для файла или уровень 0. Требует интернета."
versions = "Windows 10 1607 (уровень блокировки) и 1703 (тайм-аут); 24H2 без изменений."
verify = "Get-MpPreference | Select-Object MAPSReporting, SubmitSamplesConsent, CloudBlockLevel, CloudExtendedTimeout"
rollback = "Удалить четыре значения; Defender вернётся к умолчаниям."

[rule.params.block_level]
type = "enum"
title = "Уровень облачной блокировки"
default = 2
values = [ { value = 2, title = "Высокий" }, { value = 0, title = "По умолчанию" }, { value = 4, title = "Высокий плюс (больше ложных срабатываний)" }, { value = 6, title = "Нулевая терпимость (блокирует всё неизвестное)" } ]

[rule.params.timeout]
type = "int"
title = "Дополнительное ожидание вердикта облака, секунд"
default = 50
min = 0
max = 50

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'
name = "SpynetReporting"
kind = "DWord"
value = 2
why = "MAPS advanced"

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'
name = "SubmitSamplesConsent"
kind = "DWord"
value = 1
why = "send safe samples automatically"

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\MpEngine'
name = "MpCloudBlockLevel"
kind = "DWord"
value = "{block_level}"
why = "cloud block level High"

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\MpEngine'
name = "MpBafsExtendedTimeout"
kind = "DWord"
value = "{timeout}"

[[rule]]
id = "defender.pua"
group = "defender"
phase = "specialize"
title = "Блокировать потенциально нежелательные программы (PUA)"
level = "recommended"
default = true
requires = ["defender.realtime"]
tags = ["defender", "pua", "adware", "бандлы", "майнеры"]
doc = "docs/technical/reference/07-defender.md#defenderpuaprotection"
summary = "Defender блокирует adware, установщики-бандлы, майнеры и «оптимизаторы» при скачивании и запуске."
effect = "Закрывает самый частый канал заражения непрофессионалов: «бесплатная программа с сайта с кнопкой Скачать»."
risk = "Легитимные утилиты, помеченные как PUA (некоторые средства удалённого доступа), требуют исключения."
versions = "Политика с Windows 10 1607; переключатель в Параметрах с 2004."
verify = "Get-MpPreference | Select-Object PUAProtection"
rollback = "Удалить значение PUAProtection."

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
name = "PUAProtection"
kind = "DWord"
value = 1
why = "block potentially unwanted apps"

[[rule]]
id = "defender.network-protection"
group = "defender"
phase = "specialize"
title = "Сетевая защита: блокировать подключения к опасным адресам"
level = "recommended"
default = true
requires = ["defender.realtime"]
tags = ["defender", "network protection", "фишинг", "командные серверы"]
doc = "docs/technical/reference/07-defender.md#defendernetworkprotection"
summary = "Любое приложение, не только Edge, не может подключиться к доменам с плохой репутацией по данным SmartScreen."
effect = "Фишинговые сайты и командные серверы блокируются с уведомлением «Подключение заблокировано»."
risk = "Работает только когда Defender основной антивирус; может конфликтовать с VPN-клиентами с собственными фильтрами (тогда режим аудита)."
versions = "Windows 10 1709+."
verify = "Get-MpPreference | Select-Object EnableNetworkProtection"

[rule.params.mode]
type = "enum"
title = "Режим"
default = 1
values = [ { value = 1, title = "Блокировать" }, { value = 2, title = "Аудит (только журнал)" } ]

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\Network Protection'
name = "EnableNetworkProtection"
kind = "DWord"
value = "{mode}"

[[rule]]
id = "defender.asr"
group = "defender"
phase = "specialize"
title = "Механизм правил сокращения поверхности атаки (ASR) включён"
level = "recommended"
default = true
requires = ["defender.realtime"]
tags = ["defender", "asr", "attack surface reduction", "exploit guard"]
doc = "docs/technical/reference/07-defender.md#defenderasrrules"
summary = "Включает механизм ASR; сами правила перечислены в подгруппе и настраиваются по одному."
effect = "Без этого правила ни одно правило ASR не действует."
versions = "Доступно на всех редакциях с Defender (включая Home), управляется только политиками или PowerShell."
verify = "Get-MpPreference | Select-Object AttackSurfaceReductionRules_Ids"

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR'
name = "ExploitGuard_ASR_Rules"
kind = "DWord"
value = 1

