# Microsoft Defender, ASR rules, SmartScreen. Section 3 of the v0.2 machine script.
# Every setting is written as a policy (HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender):
# Defender reads them without its service running, and the matching switches in the interface turn grey.

[[rule]]
id = "defender.realtime"
group = "defender"
phase = "specialize"
title = "Real-time protection enabled and enforced"
level = "baseline"
default = true
tags = ["defender", "antivirus", "real-time", "amsi", "behavior monitoring"]
doc = "docs/technical/reference/07-defender.md"
summary = "Removes the values that third-party scripts use to disable Defender, and enforces real-time protection, behavior monitoring, and scanning of downloads and scripts."
effect = "The antivirus cannot be turned off through the registry; the toggles in Windows Security are managed by policy."
versions = "No changes; Tamper Protection additionally prevents the protection from being weakened."
verify = "Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, BehaviorMonitorEnabled"

[[rule.actions]]
type = "reg-remove"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
name = "DisableAntiSpyware"

[[rule.actions]]
type = "reg-remove"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
name = "DisableAntiVirus"

[[rule.actions]]
type = "reg-remove"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
name = "DisableRealtimeMonitoring"

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
name = "DisableRealtimeMonitoring"
kind = "DWord"
value = 0

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
name = "DisableBehaviorMonitoring"
kind = "DWord"
value = 0

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
name = "DisableIOAVProtection"
kind = "DWord"
value = 0

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
name = "DisableScriptScanning"
kind = "DWord"
value = 0

[[rule]]
id = "defender.cloud"
group = "defender"
phase = "specialize"
title = "Cloud protection: MAPS, sample submission, block level"
level = "recommended"
default = true
requires = ["defender.realtime"]
tags = ["defender", "cloud", "maps", "spynet", "cloud block level", "samples"]
doc = "docs/technical/reference/07-defender.md#defendercloudprotection"
summary = "MAPS membership at the \"Advanced\" level, automatic submission of safe samples, \"High\" cloud block level, and waiting up to 50 seconds for a verdict."
effect = "New malicious files without signatures are blocked by cloud reputation within seconds; a suspicious file is held for up to a minute before its first run."
risk = "The \"High\" level increases false positives on rare in-house programs; the fix is a file exclusion or level 0. Requires internet access."
versions = "Windows 10 1607 (block level) and 1703 (timeout); no changes in 24H2."
verify = "Get-MpPreference | Select-Object MAPSReporting, SubmitSamplesConsent, CloudBlockLevel, CloudExtendedTimeout"
rollback = "Delete the four values; Defender returns to its defaults."

[rule.params.block_level]
type = "enum"
title = "Cloud block level"
default = 2
values = [ { value = 2, title = "High" }, { value = 0, title = "Default" }, { value = 4, title = "High plus (more false positives)" }, { value = 6, title = "Zero tolerance (blocks everything unknown)" } ]

[rule.params.timeout]
type = "int"
title = "Extended wait for the cloud verdict, seconds"
default = 50
min = 0
max = 50

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'
name = "SpynetReporting"
kind = "DWord"
value = 2
why = "MAPS advanced"

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'
name = "SubmitSamplesConsent"
kind = "DWord"
value = 1
why = "send safe samples automatically"

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\MpEngine'
name = "MpCloudBlockLevel"
kind = "DWord"
value = "{block_level}"
why = "cloud block level High"

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\MpEngine'
name = "MpBafsExtendedTimeout"
kind = "DWord"
value = "{timeout}"

[[rule]]
id = "defender.pua"
group = "defender"
phase = "specialize"
title = "Block potentially unwanted apps (PUA)"
level = "recommended"
default = true
requires = ["defender.realtime"]
tags = ["defender", "pua", "adware", "bundleware", "miners"]
doc = "docs/technical/reference/07-defender.md#defenderpuaprotection"
summary = "Defender blocks adware, bundling installers, miners and \"optimizers\" on download and launch."
effect = "Closes the most common infection channel for non-professional users: \"a free program from a website with a Download button\"."
risk = "Legitimate utilities flagged as PUA (some remote access tools) require an exclusion."
versions = "Policy since Windows 10 1607; toggle in Settings since 2004."
verify = "Get-MpPreference | Select-Object PUAProtection"
rollback = "Delete the PUAProtection value."

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
name = "PUAProtection"
kind = "DWord"
value = 1
why = "block potentially unwanted apps"

[[rule]]
id = "defender.network-protection"
group = "defender"
phase = "specialize"
title = "Network protection: block connections to dangerous addresses"
level = "recommended"
default = true
requires = ["defender.realtime"]
tags = ["defender", "network protection", "phishing", "command and control"]
doc = "docs/technical/reference/07-defender.md#defendernetworkprotection"
summary = "No app, not just Edge, can connect to domains that have a poor reputation according to SmartScreen."
effect = "Phishing sites and command-and-control servers are blocked with a \"Connection blocked\" notification."
risk = "Works only when Defender is the primary antivirus; may conflict with VPN clients that have their own filters (use audit mode in that case)."
versions = "Windows 10 1709+."
verify = "Get-MpPreference | Select-Object EnableNetworkProtection"

[rule.params.mode]
type = "enum"
title = "Mode"
default = 1
values = [ { value = 1, title = "Block" }, { value = 2, title = "Audit (log only)" } ]

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\Network Protection'
name = "EnableNetworkProtection"
kind = "DWord"
value = "{mode}"

[[rule]]
id = "defender.asr"
group = "defender"
phase = "specialize"
title = "Attack surface reduction (ASR) rules engine enabled"
level = "recommended"
default = true
requires = ["defender.realtime"]
tags = ["defender", "asr", "attack surface reduction", "exploit guard"]
doc = "docs/technical/reference/07-defender.md#defenderasrrules"
summary = "Enables the ASR engine; the rules themselves are listed in a subgroup and configured one by one."
effect = "Without this rule, no ASR rule takes effect."
versions = "Available in all editions with Defender (including Home); managed only through policies or PowerShell."
verify = "Get-MpPreference | Select-Object AttackSurfaceReductionRules_Ids"

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR'
name = "ExploitGuard_ASR_Rules"
kind = "DWord"
value = 1

