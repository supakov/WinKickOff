tags = ["asr", "psexec", "wmi", "lateral movement", "d1e49aac"]
doc = "docs/technical/reference/07-defender.md#rules-table"
summary = "Remote execution through PsExec and WMI is logged. In block mode, the rule would interfere with remote administration by your own IT specialist."
effect = "Auditing reveals attempts at lateral movement across the network."
risk = "High in block mode if administration relies on PsExec/WMI."
versions = "Windows 10 1803+."

[rule.params.mode]
type = "enum"
title = "Mode"
default = 2
values = [ { value = 2, title = "Audit" }, { value = 6, title = "Warn" }, { value = 1, title = "Block" } ]

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
name = "d1e49aac-8f56-4280-b9ba-993a6d77406c"
kind = "String"
value = "{mode}"
why = "ASR rule"

[[rule]]
id = "asr.lsass"
group = "defender.asr"
phase = "specialize"
title = "ASR: block credential stealing from LSASS"
level = "optional"
default = false
requires = ["defender.asr"]
tags = ["asr", "lsass", "mimikatz", "9e6c4e1f"]
doc = "docs/technical/reference/07-defender.md#rules-table"
summary = "Duplicates the LSA protection rule (RunAsPPL) and produces a lot of noise in the log; off by default."
effect = "Makes sense only where LSA protection cannot be enabled (unsigned smart card plug-ins)."
risk = "Many events from legitimate programs (the Chrome updater and others). Warn mode is not supported."
versions = "Windows 10 1803+."

[rule.params.mode]
type = "enum"
title = "Mode"
default = 1
values = [ { value = 1, title = "Block" }, { value = 2, title = "Audit" } ]

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
name = "9e6c4e1f-7d60-472f-ba1a-a39ef669e4b2"
kind = "String"
value = "{mode}"
why = "ASR rule"

# ---------------------------------------------------------------------------- other Defender settings

[[rule]]
id = "defender.controlled-folder-access"
group = "defender"
phase = "specialize"
title = "Controlled Folder Access (mode)"
level = "optional"
default = true
requires = ["defender.realtime"]
tags = ["defender", "controlled folder access", "crypto ransomware", "documents"]
doc = "docs/technical/reference/07-defender.md#controlledfolderaccess"
summary = "Sets the protection mode for the Documents, Pictures and Desktop folders. The default is 0 (off), set as a policy so the user cannot turn it on by accident."
effect = "In block mode, only trusted apps can write to protected folders; ransomware launched by the user cannot damage documents."
risk = "Mode 1 breaks accounting software (1C, M.E.Doc, client-bank apps), older versions of Office and any in-house programs that write to Documents. Recommended path: a month in audit mode (2), review of events 1123/1124, then block mode."
versions = "Windows 10 1709+."
verify = "Get-MpPreference | Select-Object EnableControlledFolderAccess"
rollback = "Value 0."

[rule.params.mode]
type = "enum"
title = "Mode"
default = 0
values = [ { value = 0, title = "Off" }, { value = 2, title = "Audit" }, { value = 1, title = "Block (breaks older programs)" } ]

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\Controlled Folder Access'
name = "EnableControlledFolderAccess"
kind = "DWord"
value = "{mode}"

