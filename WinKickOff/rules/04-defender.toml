[[rule]]
id = "defender.smartscreen-shell"
group = "defender"
phase = "specialize"
title = "SmartScreen for downloaded programs and files"
level = "recommended"
default = true
tags = ["smartscreen", "downloads", "mark of the web", "reputation"]
doc = "docs/technical/reference/07-defender.md#smartscreenlevel"
summary = "Running a program downloaded from the internet that has no reputation shows a warning (Warn) or is blocked (Block)."
effect = "Works based on the Internet zone mark; files from USB flash drives and the local network are not checked (they are covered by the ASR rule for USB and by cloud protection)."
risk = "Block mode prevents installing any uncommon program, including accounting software from developer websites."
versions = "ShellSmartScreenLevel policy since Windows 10 1703."
verify = "Windows Security -> App & browser control -> Check apps and files"
rollback = "Delete ShellSmartScreenLevel; the default Warn remains, but the user will be able to turn it off."

[rule.params.level]
type = "enum"
title = "Level"
default = "Warn"
values = [ { value = "Warn", title = "Warn" }, { value = "Block", title = "Block" } ]

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
name = "EnableSmartScreen"
kind = "DWord"
value = 1

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
name = "ShellSmartScreenLevel"
kind = "String"
value = "{level}"
