[[rule]]
id = "defender.smartscreen-shell"
group = "defender"
phase = "specialize"
title = "SmartScreen для скачанных программ и файлов"
level = "recommended"
default = true
tags = ["smartscreen", "загрузки", "mark of the web", "репутация"]
doc = "docs/technical/reference/07-defender.md#smartscreenlevel"
summary = "Запуск скачанной из интернета программы без репутации показывает предупреждение (Warn) или запрещается (Block)."
effect = "Работает по метке зоны интернета; файлы с флешек и из локальной сети не проверяются (их покрывают правило ASR для USB и облачная защита)."
risk = "Режим Block запрещает установку любой малораспространённой программы, включая программы учёта с сайтов разработчиков."
versions = "Политика ShellSmartScreenLevel с Windows 10 1703."
verify = "Безопасность Windows -> Управление приложениями и браузером -> Проверка приложений и файлов"
rollback = "Удалить ShellSmartScreenLevel; останется умолчание Warn, но пользователь сможет выключить."

[rule.params.level]
type = "enum"
title = "Уровень"
default = "Warn"
values = [ { value = "Warn", title = "Предупреждать" }, { value = "Block", title = "Блокировать" } ]

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
name = "EnableSmartScreen"
kind = "DWord"
value = 1

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
name = "ShellSmartScreenLevel"
kind = "String"
value = "{level}"
