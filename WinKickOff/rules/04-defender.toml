summary = "Записывает режим защиты папок Документы, Изображения, Рабочий стол. По умолчанию 0 (выключено) как политика: пользователь не включит случайно."
effect = "В режиме блокировки писать в защищённые папки могут только доверенные приложения; шифровальщик, запущенный пользователем, документы не испортит."
risk = "Режим 1 ломает программы учёта (1С, M.E.Doc, клиент-банки), старый Office и любые самописные программы, пишущие в Документы. Рекомендуемый путь: месяц аудита (2), разбор событий 1123/1124, затем блокировка."
versions = "Windows 10 1709+."
verify = "Get-MpPreference | Select-Object EnableControlledFolderAccess"
rollback = "Значение 0."

[rule.params.mode]
type = "enum"
title = "Режим"
default = 0
