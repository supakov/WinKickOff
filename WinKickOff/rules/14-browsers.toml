risk = "Значение 2 может задержать критические исправления безопасности: Google его не рекомендует. В сценарии issue #1 было несуществующее имя ChromeVariationsEnabled."
versions = "Chrome 83 и новее."

[rule.params.mode]
type = "enum"
title = "Режим полевых испытаний"
default = 1
values = [ { value = 1, title = "Только критические исправления безопасности и стабильности" }, { value = 2, title = "Выключить все (не рекомендуется Google)" } ]

