doc = "docs/technical/reference/18-browsers.md#microsoft-edge"
summary = "Edge не собирает сведения о поиске в сторонних поисковых системах (телеметрия 3P SERP)."
effect = "Запросы к Google и другим поисковикам не попадают в телеметрию Edge."
versions = "Edge 120 и новее."

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge'
