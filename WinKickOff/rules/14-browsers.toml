# Браузеры: Microsoft Edge, Google Chrome, Brave (issue #1). Создаётся tools/make_browser_rules.py;
# правьте таблицу в этом инструменте, а не файл. Включённые по умолчанию правила перечислены в DEFAULT_ON.

[[rule]]
id = "edge.diagnostic-data-off"
group = "browsers.edge"
phase = "specialize"
title = "Edge: не отправлять диагностические данные"
level = "optional"
default = true
tags = ["edge", "браузер", "политика", "diagnosticdata", "телеметрия", "диагностика"]
doc = "docs/technical/reference/18-browsers.md#microsoft-edge"
summary = "Edge не отправляет Microsoft ни обязательные, ни необязательные диагностические данные о работе браузера."
effect = "Сведения об использовании браузера и посещённых сайтах не уходят в Microsoft. Заменяет устаревшие политики MetricsReportingEnabled и SendSiteInfoToImproveServices из сценария issue #1."
versions = "Edge 122 и новее на Windows 10 и 11; старые версии Edge подчиняются общей настройке телеметрии Windows."

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge'
name = "DiagnosticData"
kind = "DWord"
value = 0

[[rule]]
id = "edge.search-telemetry-off"
group = "browsers.edge"
phase = "specialize"
title = "Edge: не собирать запросы к сторонним поисковикам"
