group = "browsers.edge"
phase = "specialize"
title = "Edge: скрыть боковую панель"
level = "optional"
default = false
tags = ["edge", "браузер", "политика", "hubssidebarenabled", "боковая панель", "sidebar", "copilot"]
doc = "docs/technical/reference/18-browsers.md#microsoft-edge"
summary = "Боковая панель Edge с приложениями и ярлыками не показывается."
effect = "Меньше отвлекающих элементов. До Edge 141 вместе с панелью скрывается и кнопка Copilot; с версии 141 значок Copilot управляется политикой, которая действует только для профилей Entra ID."
