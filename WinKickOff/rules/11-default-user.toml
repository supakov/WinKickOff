[[rule]]
id = "default-user.widgets-button-off"
group = "default-user"
phase = "default-user"
title = "Кнопка виджетов скрыта"
level = "recommended"
default = true
requires = ["privacy.widgets-off"]
tags = ["виджеты", "taskbarda", "панель задач"]
doc = "docs/technical/reference/14-default-user-profile.md#values-under-other-conditions"
summary = "Кнопка виджетов на панели задач скрыта у каждого нового пользователя (дублирует политику Dsh)."
effect = "Панель задач без кнопки погоды и новостей."
versions = "Windows 11."

[[rule.actions]]
type = "reg"
path = 'DU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
name = "TaskbarDa"
kind = "DWord"
value = 0
default = "absent"

[[rule]]
id = "default-user.copilot-off"
group = "default-user"
phase = "default-user"
title = "Copilot выключен в профиле пользователя"
level = "recommended"
default = true
requires = ["privacy.copilot-recall-off"]
tags = ["copilot", "панель задач", "политика пользователя"]
doc = "docs/technical/reference/14-default-user-profile.md#values-under-other-conditions"
summary = "Кнопка Copilot скрыта; пользовательская политика TurnOffWindowsCopilot записана в профиль (единственный уровень, где она действует)."
effect = "Copilot Preview (23H2) не появляется; в 24H2 приложение удаляется отдельным правилом."
versions = "ShowCopilotButton и политика с Windows 11 23H2."

[[rule.actions]]
type = "reg"
path = 'DU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
name = "ShowCopilotButton"
kind = "DWord"
value = 0
default = "absent"

[[rule.actions]]
type = "reg"
path = 'DU:\Software\Policies\Microsoft\Windows\WindowsCopilot'
name = "TurnOffWindowsCopilot"
kind = "DWord"
value = 1
why = "user-scope policy"

[[rule]]
