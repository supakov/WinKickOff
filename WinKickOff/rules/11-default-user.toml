# Профиль пользователя по умолчанию (куст C:\Users\Default\NTUSER.DAT, смонтирован как $du).
# Раздел 10 скрипта машины v0.2. Пути DU:\ генератор заменяет на "$du\".
# Это личные настройки пользователя, а не политики: пользователь может их изменить в Параметрах.

[[rule]]
id = "default-user.show-file-extensions"
group = "default-user"
phase = "default-user"
title = "Показывать расширения файлов"
level = "baseline"
default = true
tags = ["расширения", "hidefileext", "проводник", "фишинг"]
doc = "docs/technical/reference/14-default-user-profile.md"
summary = "Расширения файлов видны: «счёт.pdf.exe» не притворится PDF."
effect = "Главная настройка безопасности этого раздела; умолчание Windows скрывает расширения."
versions = "Все версии."
verify = "Get-ItemProperty HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced -Name HideFileExt"
rollback = "Параметры проводника -> Вид."

[[rule.actions]]
type = "reg"
path = 'DU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
name = "HideFileExt"
kind = "DWord"
value = 0
why = "show extensions"
default = "absent"

[[rule]]
id = "default-user.no-sync-provider-ads"
group = "default-user"
phase = "default-user"
title = "Без рекламы OneDrive и Microsoft 365 в проводнике"
level = "baseline"
default = true
tags = ["проводник", "onedrive", "реклама"]
doc = "docs/technical/reference/14-default-user-profile.md"
summary = "Уведомления поставщиков синхронизации в проводнике выключены."
effect = "Проводник не показывает баннеры OneDrive и подписки."
versions = "Windows 10 1607+."

[[rule.actions]]
type = "reg"
path = 'DU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
name = "ShowSyncProviderNotifications"
kind = "DWord"
value = 0
default = "absent"

[[rule]]
id = "default-user.no-consumer-content"
group = "default-user"
phase = "default-user"
title = "Без предустановок, рекламы, советов и экрана «Завершим настройку»"
level = "recommended"
default = true
requires = ["privacy.consumer-content"]
tags = ["contentdeliverymanager", "предустановки", "реклама", "spotlight", "scoobe", "пуск", "рекламный идентификатор"]
doc = "docs/technical/reference/14-default-user-profile.md#values-under-the-disableconsumercontent-condition"
summary = "17 значений ContentDeliveryManager (Store не ставит приложения тихо, нет советов и «интересных фактов»), нет экрана «Завершим настройку устройства», нет рекомендаций и напоминаний про учётную запись Microsoft в Пуске, рекламный идентификатор и персонализированные предложения выключены."
effect = "Именно эти значения делают на Pro то, что политика DisableWindowsConsumerFeatures делает на Enterprise."
versions = "Start_IrisRecommendations с Windows 11 22H2; Start_AccountNotifications с 23H2; остальное с Windows 10."
rollback = "Параметры -> Персонализация и Конфиденциальность, либо те же значения в кусте Default."

