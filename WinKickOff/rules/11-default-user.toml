default = "absent"

[[rule]]
id = "default-user.region"
group = "default-user"
phase = "default-user"
title = "Регион пользователя"
level = "baseline"
default = true
tags = ["регион", "geo", "украина", "store"]
doc = "docs/technical/reference/14-default-user-profile.md#unconditional-values"
summary = "Страна (GeoID) для новых пользователей: влияет на Store, погоду и предложения контента; не меняет язык интерфейса и часовой пояс."
effect = "По умолчанию Украина (241, UA)."
versions = "Значение Name читается Windows 10 1803+ в первую очередь."

[rule.params.geo_id]
type = "string"
title = "GeoID страны"
default = "241"

[rule.params.geo_name]
type = "string"
title = "Двухбуквенный код страны"
default = "UA"

[[rule.actions]]
type = "reg"
path = 'DU:\Control Panel\International\Geo'
name = "Nation"
kind = "String"
value = "{geo_id}"
default = "unknown"

[[rule.actions]]
type = "reg"
path = 'DU:\Control Panel\International\Geo'
name = "Name"
kind = "String"
value = "{geo_name}"
default = "unknown"

[[rule]]
id = "default-user.http-accept-language-optout"
group = "default-user"
phase = "default-user"
title = "Не сообщать сайтам список языков пользователя"
level = "optional"
default = true
tags = ["accept-language", "отпечаток", "браузер", "конфиденциальность"]
doc = "docs/technical/reference/14-default-user-profile.md#unconditional-values"
summary = "Браузеры не передают сайтам список предпочитаемых языков (уменьшает отпечаток)."
effect = "Сайты определяют язык по другим признакам."
versions = "Windows 10+."

[[rule.actions]]
type = "reg"
path = 'DU:\Control Panel\International\User Profile'
name = "HttpAcceptLanguageOptOut"
kind = "DWord"
value = 1
default = "absent"
