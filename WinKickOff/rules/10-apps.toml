# Службы и удаление приложений. Раздел 9 скрипта машины v0.2.
# Каждое приложение отдельным правилом: генератор собирает все включённые действия appx в один вызов Remove-Apps.

[[rule]]
id = "apps.retail-demo-off"
group = "apps"
phase = "specialize"
title = "Служба демонстрационного режима магазина отключена"
level = "baseline"
default = true
tags = ["retaildemo", "служба"]
doc = "docs/technical/reference/13-services-apps.md"
summary = "Служба RetailDemo нужна только витринным ПК."
effect = "Одна фоновая служба меньше."

[[rule.actions]]
type = "service"
name = "RetailDemo"
start = 4

[[rule]]
id = "apps.xbox-services-off"
group = "apps"
phase = "specialize"
title = "Службы Xbox отключены, запись игр (Game DVR) выключена"
level = "recommended"
default = true
tags = ["xbox", "game bar", "gamedvr", "службы"]
doc = "docs/technical/reference/13-services-apps.md#removexboxservices"
summary = "Службы Xbox Live (аутентификация, сохранения, сеть, контроллеры) отключены; политика запрещает запись игр и Game Bar."
effect = "Нет фоновых служб Xbox и записи экрана в фоне, которая грузит слабые ПК. Игры из Store с Xbox Live не работают."
versions = "XboxGipSvc с Windows 10 1709."
verify = "Get-Service Xbl*, XboxNetApiSvc, XboxGipSvc | Select-Object Name, StartType"
rollback = "Set-Service <имя> -StartupType Manual; удалить AllowGameDVR."

[[rule.actions]]
type = "service"
name = "XblAuthManager"
start = 4

[[rule.actions]]
type = "service"
name = "XblGameSave"
start = 4

[[rule.actions]]
type = "service"
name = "XboxNetApiSvc"
start = 4

[[rule.actions]]
type = "service"
name = "XboxGipSvc"
start = 4

[[rule.actions]]
type = "reg"
path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\GameDVR'
name = "AllowGameDVR"
kind = "DWord"
value = 0

[[rule]]
id = "apps.maps-broker-off"
group = "apps"
phase = "specialize"
title = "Служба загрузки офлайн-карт отключена"
level = "optional"
default = true
requires = ["apps.remove.maps"]
tags = ["mapsbroker", "карты", "служба"]
doc = "docs/technical/reference/13-services-apps.md#removexboxservices"
summary = "MapsBroker обслуживает приложение «Карты»; без приложения служба не нужна. В файле v0.2 отключалась под условием Xbox, здесь привязана к удалению Карт."
effect = "Одна автоматическая служба меньше."
rollback = "Set-Service MapsBroker -StartupType Automatic"

[[rule.actions]]
type = "service"
name = "MapsBroker"
start = 4

[[rule]]
id = "apps.remove-quick-assist"
group = "apps"
phase = "specialize"
title = "Удалить Быструю помощь (Quick Assist)"
level = "recommended"
default = true
tags = ["quick assist", "быстрая помощь", "мошенники", "удалённый доступ", "capability"]
doc = "docs/technical/reference/13-services-apps.md#removequickassist"
summary = "Штатное средство удалённого управления, которое мошенники «техподдержки» просят запустить по телефону, удаляется (компонент Windows 10 и Store-версия Windows 11)."
effect = "Для поддержки своим администратором организация выбирает инструмент сама. Пользователь может установить Quick Assist обратно из Store."
versions = "Компонент App.Support.QuickAssist в Windows 10 1809+ и 11 21H2; с 22H2 приложение Store."
verify = "Get-WindowsCapability -Online -Name 'App.Support.QuickAssist*'"
rollback = "Store -> Быстрая помощь, или Add-WindowsCapability -Online -Name App.Support.QuickAssist~~~~0.0.1.0"

[[rule.actions]]
type = "capability"
pattern = "App.Support.QuickAssist*"

[[rule.actions]]
type = "appx"
names = ["MicrosoftCorporationII.QuickAssist"]

